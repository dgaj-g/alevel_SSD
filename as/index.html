<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AS Software Systems Development</title>
<style>
  :root { --navy: #0F5257; --gold: #F0A830; --tint: #F1F6F5; --ink: #1C2430; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--tint); color: var(--ink);
    font: 18px/1.5 "Segoe UI", system-ui, -apple-system, sans-serif; }
  header { background: var(--navy); color: #fff; padding: 28px 16px; }
  header h1 { margin: 0 auto; max-width: 760px; font-size: 1.6rem; }
  main { max-width: 760px; margin: 0 auto; padding: 24px 16px 48px; }
  .card { background: #fff; border-radius: 12px; padding: 24px;
    box-shadow: 0 1px 3px rgba(0,0,0,.12); }
  .go { display: inline-block; margin-top: 8px; background: var(--gold);
    color: var(--ink); font-weight: 700; text-decoration: none;
    padding: 14px 22px; border-radius: 10px; }
  .go:focus-visible { outline: 3px solid var(--navy); outline-offset: 3px; }
  .wait { font-style: italic; }
</style>
</head>
<body>
<header><h1>AS Software Systems Development</h1></header>
<main>
  <div class="card">
    <p>Your coursework guide. Build your own game in Visual Studio 2019, one chapter at a time.</p>
    <p>Sign in with your school account. Your ticks are saved as you go.</p>
    <p id="open"><span class="wait">The link is added here when the platform goes live.</span></p>
  </div>
</main>
</body>
</html>
