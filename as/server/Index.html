<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<base target="_top">
<title>AS Software Systems Development</title>
<style>
/* A2 SSD platform \2014  plain examiner register. Built at 1280x800; fits 1024 to 1440 wide (G3). Ported from the approved prototype. */
@import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&display=swap');
:root{--ink:#1c2430;--mute:#5c6774;--line:#d9dee5;--bg:#f3f6f6;--card:#fff;--navy:#0f5257;--gold:#f0a830;--ok:#1b7f3b;--bad:#b3261e;--tint:#f1f6f5;--wd:#dcefed;--mono:"JetBrains Mono",Menlo,Consolas,monospace;--sans:-apple-system,"Segoe UI",Calibri,Arial,sans-serif}
:root{--white:#fff;--black:#000;--white-a90:rgba(255,255,255,.9);--shadow-a08:rgba(0,0,0,.08);--shadow-a30:rgba(0,0,0,.3);--shadow-a35:rgba(0,0,0,.35);--grey-50:#fafbfc;--grey-60:#f7f8fa;--grey-70:#f1f3f6;--grey-80:#eef1f4;--grey-90:#eef1f5;--grey-100:#e6e9ee;--grey-110:#e6eaf0;--grey-120:#e3e7ed;--grey-200:#c9d1dc;--grey-300:#b9c2cf;--grey-400:#a0a8b3;--grey-410:#9aa4b0;--grey-420:#9aa6b8;--grey-500:#8a94a0;--grey-510:#8a94a3;--grey-600:#6b7380;--grey-900:#28303c;--navy-a15:rgba(15,82,87,.15);--navy-a25:rgba(15,82,87,.25);--navy-a28:rgba(15,82,87,.28);--navy-a35:rgba(15,82,87,.35);--navy-wash-1:#fbfdfd;--navy-wash-2:#f4f9f8;--navy-wash-3:#f1f8f7;--navy-wash-4:#ecf4f3;--navy-wash-5:#e6f2f1;--navy-wash-6:#e6f1f0;--navy-wash-7:#e1efee;--navy-wash-8:#dbeceb;--navy-edge-1:#c2dcda;--navy-edge-2:#b5d3d1;--gold-a45:rgba(240,168,48,.45);--gold-wash-1:#fffbea;--gold-wash-2:#fffaf0;--gold-wash-3:#fff8e1;--gold-wash-4:#fff8dc;--gold-edge-1:#f1dc9a;--gold-edge-2:#d9c27a;--gold-deep-1:#7a5a00;--gold-deep-2:#5a4300;--gold-deep-3:#4a3b00;--hl:#fff3c4;--hl-strong:#ffe89a;--hl-strongest:#ffe27a;--hl-ink:#3b2e00;--ok-wash-1:#e6f4ea;--ok-wash-2:#e8f5ec;--ok-wash-3:#f1faf3;--ok-wash-4:#e3f5e8;--ok-edge:#bfe0c8;--bad-wash-1:#fdecea;--bad-wash-2:#fde3e1;--bad-wash-3:#fff3f0;--bad-wash-4:#ffecec;--bad-edge:#f3b8b3;--bad-deep:#a3271b;--bad-strong:#c62828;--warn:#e39b12;--ssms-key:#0000ff;--ssms-fn:#ff00ff;--ssms-str:#ff0000;--ssms-comment:#008000;--ssms-op:#808080;--cs-key:#0b4a9e;--cs-str:#a3410b;--cs-comment:#6a8a5a;--cs-num:#7a1f8a;--cs-type:#0b6b6b;--navy-a18:rgba(15,82,87,.18);--wd-hover:#c4e4e0;--wd-flash:#9fd3cc;--wd-typed:#d6ecd9;--fix-ink:#9a3412}
*{box-sizing:border-box}html,body{margin:0;height:100%}
body{font:15px/1.45 var(--sans);color:var(--ink);background:var(--bg)}
button{font:inherit;cursor:pointer}
input,textarea,select{font:inherit;color:var(--ink)}
[hidden]{display:none!important}
.app{width:100%;min-width:1000px;height:100vh;margin:0 auto;display:flex;flex-direction:column;background:var(--bg);overflow:hidden}
header.bar{height:52px;background:var(--navy);color:var(--white);display:flex;align-items:center;padding:0 20px;gap:14px;flex:none}
header.bar .title{font-weight:700;font-size:17px}header.bar .school{opacity:.8;font-size:13px}
header.bar .who{margin-left:auto;font-size:14px;white-space:nowrap}header.bar .crumb{font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}header.bar .crumb a{color:var(--white);text-decoration:underline;cursor:pointer}
.sysbar{flex:none;display:flex;gap:12px;align-items:center;padding:8px 20px;background:var(--gold-wash-3);border-bottom:1px solid var(--gold-edge-1);font-size:14px}
.sysbar.bad{background:var(--bad-wash-1);border-color:var(--bad-edge)}
.sysbar .btn{padding:5px 12px;font-size:14px}
main{flex:1;min-height:0;overflow:auto;padding:22px 28px}
main.split{display:grid;grid-template-columns:minmax(380px,38%) 1fr;gap:0;padding:0;overflow:hidden}
.figure{border-right:1px solid var(--line);background:var(--card);overflow:auto;height:100%;padding:0 0 16px;min-width:0}
.figure .tabs{display:flex;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--card);z-index:1}
.figure .tabs button{flex:1;border:0;background:transparent;padding:10px 4px;font-weight:700;font-size:12px;letter-spacing:.06em;color:var(--mute);border-bottom:3px solid transparent}
.figure .tabs button.on{color:var(--navy);border-bottom-color:var(--gold)}
.figure .cap{font-size:12px;color:var(--mute);padding:10px 12px 0}
.tbls{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:10px 12px 0;align-items:start}
.paperfig .tbls{grid-template-columns:repeat(auto-fill,minmax(210px,1fr));padding:0}
.tbl{border:1px solid var(--grey-300);border-radius:8px;background:var(--white);overflow:hidden;min-width:0}
.tbl h4{margin:0;padding:6px 10px;font-size:13px;letter-spacing:.04em;background:var(--tint);border-bottom:1px solid var(--grey-300);color:var(--navy)}
.tbl table{border-collapse:collapse;width:100%;font-size:13px}.tbl td{padding:3px 8px;border-bottom:1px solid var(--grey-80)}.tbl tr:last-child td{border-bottom:0}
.tbl td.t{color:var(--mute);font-family:var(--mono);font-size:12px;text-align:right;white-space:nowrap}
.tbl td.none{color:var(--mute);font-size:12px;font-style:italic}
.tbl .pk{font-weight:700}.tag{display:inline-block;font-size:10px;font-weight:700;letter-spacing:.05em;padding:0 5px;border-radius:4px;margin-left:6px;background:var(--tint);color:var(--navy);border:1px solid var(--line)}
.tbl.hl{border-color:var(--gold);box-shadow:0 0 0 2px var(--gold-a45)}.tbl.hl2{border-color:var(--gold-edge-2)}
.tbl tr.hl td{background:var(--hl)}.tbl tr.hl.strong td{background:var(--hl-strongest)}.tbl.hl.strong{box-shadow:0 0 0 3px var(--gold)}
.pick-fields tr[data-f]{cursor:pointer}.pick-fields tr[data-f]:hover td{background:var(--navy-wash-5)}.pick-tables .tbl{cursor:pointer}.pick-tables .tbl:hover{border-color:var(--navy);box-shadow:0 0 0 2px var(--navy-a25)}
.legend{font-size:12px;color:var(--mute);padding:10px 12px 0}
.subcap{font-size:12px;font-weight:700;letter-spacing:.05em;color:var(--mute);padding:14px 12px 0;text-transform:uppercase}
.paperfig .subcap,.paperfig .legend{padding-left:0}
.sample{padding:8px 12px 0}.paperfig .sample{padding-left:0}
.sample table,.data table{border-collapse:collapse;font-size:12px;font-family:var(--mono)}.sample th,.data th{text-align:left;background:var(--tint);padding:3px 5px;border:1px solid var(--line)}.sample td,.data td{padding:2px 5px;border:1px solid var(--line);white-space:nowrap}
.data{padding:0 12px 10px}.data h4{margin:12px 0 4px;font-size:13px}.data h4 small{font-weight:400;color:var(--mute);margin-left:6px}.data .scroll{overflow-x:auto}
.work{overflow:auto;padding:18px 26px 90px;position:relative;min-width:0}
.rail{display:flex;gap:22px;font-size:14px;color:var(--mute);margin-bottom:14px;flex-wrap:wrap}
.rail .st{display:flex;align-items:center;gap:7px;border:0;background:none;padding:0;color:inherit;text-align:left}
.rail button.st:hover span{text-decoration:underline}
.rail i{width:14px;height:14px;border-radius:50%;border:2px solid var(--grey-410);display:inline-block;flex:none}
.rail .now{color:var(--navy);font-weight:700}.rail .now i{background:var(--navy);border-color:var(--navy)}
.rail .done i{background:var(--ok);border-color:var(--ok)}.rail .skip{opacity:.6}.rail small{display:block;font-size:11px;font-weight:400;color:var(--mute)}
h1{font-size:24px;margin:0 0 6px}h2{font-size:19px;margin:0 0 8px}h3{font-size:15px;margin:0 0 8px}
.sub{color:var(--mute);margin:0 0 18px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px 18px;margin-bottom:14px}
.card h3{display:flex;align-items:center;gap:10px}
.ask{font-size:17px;margin:4px 0 14px}.ask q{quotes:"\201C" "\201D"}
.lead{margin:0 0 6px;color:var(--ink)}
.btn{background:var(--navy);color:var(--white);border:0;border-radius:8px;padding:10px 18px;font-weight:600;font-size:15px}
.btn.sec{background:var(--white);color:var(--navy);border:1px solid var(--navy)}.btn.ghost{background:transparent;color:var(--navy);border:0;text-decoration:underline;padding:6px 4px}
.btn:disabled{opacity:.45;cursor:default}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:18px;margin-top:18px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:22px;min-height:190px;text-align:left;display:flex;flex-direction:column;gap:8px;color:var(--ink)}
.tile.live{cursor:pointer;border-color:var(--navy)}.tile.live:hover{box-shadow:0 2px 10px var(--navy-a15)}
.tile h2{margin:0}.tile p{margin:0}.tile .state{margin-top:auto;font-size:13px;color:var(--mute)}.tile.soon{color:var(--mute)}.tile.soon .soon{font-weight:700;color:var(--mute);margin-top:auto}
.papers{list-style:none;padding:0;margin:0}
.papers li{display:grid;grid-template-columns:1fr 90px 80px 280px;gap:12px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 16px;margin-bottom:8px}
.papers li.open{cursor:pointer}.papers li.open:hover{border-color:var(--navy)}.papers li.locked{color:var(--mute)}
.pill{justify-self:end;font-size:13px;padding:4px 10px;border-radius:999px;background:var(--tint);border:1px solid var(--line);text-align:right}.pill.grey{color:var(--mute)}.pill.go{background:var(--navy-wash-5);color:var(--navy);border-color:var(--navy-edge-1)}.pill.done{background:var(--ok-wash-1);color:var(--ok);border-color:var(--ok-edge)}
.parts{list-style:none;padding:0;margin:0}.parts li{display:grid;grid-template-columns:48px 1fr 80px 300px;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.parts li:last-child{border-bottom:0}.parts .state{display:flex;flex-direction:column;align-items:flex-end;gap:6px;text-align:right}
.doors{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin:14px 0 10px}
.door{background:var(--card);border:2px solid var(--line);border-radius:12px;padding:22px;text-align:left;display:flex;flex-direction:column;gap:8px;position:relative;color:var(--ink)}
.door:hover{border-color:var(--navy)}.door b{font-size:19px}.door span{color:var(--mute);font-size:14px}
.door .sug{position:absolute;top:-11px;right:14px;background:var(--gold);color:var(--ink);font-size:11px;font-weight:700;padding:2px 9px;border-radius:999px}
.check{list-style:none;padding:0;margin:0}.check li{padding:5px 0 5px 26px;position:relative}.check li::before{position:absolute;left:2px;top:5px;font-weight:700}
.check li.hit::before{content:"\2713";color:var(--ok)}.check li.miss::before{content:"\2717";color:var(--bad)}
.marklist{list-style:none;padding:0;margin:0}.marklist li{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:7px 0;border-bottom:1px solid var(--line)}.marklist li:last-child{border:0}.marklist .mk{flex:none;font-size:12px;font-weight:700;color:var(--navy);background:var(--tint);border:1px solid var(--line);border-radius:999px;padding:2px 10px}
.habits{margin:0;padding-left:18px}
/* editor (SPEC 4): gutter, SSMS colours, 15px / 1.5, 6 to 20 lines then it scrolls */
.ed{position:relative;display:flex;border:1px solid var(--line);border-radius:8px;background:var(--white);font-family:var(--mono);font-size:15px;line-height:1.5;overflow:hidden}
.ed:focus-within{border-color:var(--navy);box-shadow:0 0 0 2px var(--navy-a15)}
.ed-g{flex:none;min-width:3em;background:var(--tint);border-right:1px solid var(--line);color:var(--grey-500);text-align:right;overflow:hidden;position:relative;user-select:none}
.ed-gi{padding:10px 8px 10px 6px;white-space:pre;font-size:13px;line-height:22.5px}
.ed-c{position:relative;flex:1;min-width:0;overflow:hidden}
.ed-c pre,.ed-c textarea{margin:0;padding:10px 12px;font:inherit;font-size:15px;line-height:22.5px;white-space:pre;tab-size:4;letter-spacing:0}
.ed-c pre{position:absolute;top:0;left:0;min-width:100%;pointer-events:none;color:var(--black);will-change:transform}
.ed-c textarea{position:relative;display:block;width:100%;resize:none;background:transparent;color:transparent;caret-color:var(--black);border:0;outline:0;overflow:auto;z-index:1}
.ed-c textarea::placeholder{color:var(--grey-500)}
.ed-cur{position:absolute;left:0;right:0;height:22.5px;background:var(--tint);pointer-events:none;display:none}
.ed:focus-within .ed-cur{display:block}
.ed.ro{background:var(--grey-50)}.ed.ro .ed-c{overflow-x:auto}.ed.ro .ed-c pre{position:static}
.stubed{margin-bottom:8px}
.k{color:var(--ssms-key)}.f{color:var(--ssms-fn)}.s{color:var(--ssms-str)}.c{color:var(--ssms-comment)}.o{color:var(--ssms-op)}.n{color:var(--black)}
/* written answers */
textarea.prose{width:100%;min-height:120px;padding:10px 12px;border:1px solid var(--line);border-radius:8px;resize:vertical;font-size:15px;line-height:1.5}
textarea.prose:focus,input.txt:focus,.cloze input:focus{outline:0;border-color:var(--navy);box-shadow:0 0 0 2px var(--navy-a15)}
input.txt{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:8px}
.rowsans{border-collapse:collapse;width:100%}.rowsans th{text-align:left;font-size:13px;color:var(--mute);padding:4px 6px}.rowsans td{padding:4px 6px;vertical-align:top}.rowsans td.fld{font-family:var(--mono);font-weight:600;white-space:nowrap;padding-top:12px}
.rowsans td:nth-child(2){width:28%}
.cloze{margin:0;font-family:var(--mono);font-size:14px;line-height:34px;white-space:pre-wrap;border:1px solid var(--line);border-radius:8px;background:var(--grey-50);padding:10px 14px}
.cloze label{display:inline-flex;align-items:center;gap:4px;vertical-align:baseline}
.cloze label b{font-size:11px;color:var(--navy);background:var(--tint);border:1px solid var(--line);border-radius:4px;padding:0 4px;line-height:18px}
.cloze input{font-family:var(--mono);font-size:14px;width:18ch;padding:2px 6px;border:1px solid var(--grey-410);border-radius:5px;background:var(--white);line-height:22px}
.prosebox{white-space:pre-wrap;background:var(--grey-50);border:1px solid var(--line);border-radius:8px;padding:10px 14px;margin:0}
.confirm{margin-top:10px;padding:10px 14px;background:var(--gold-wash-3);border:1px solid var(--gold-edge-1);border-radius:8px}
.marks{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px}
.score{font-size:40px;font-weight:700;line-height:1;margin-bottom:10px}.score small{font-size:16px;color:var(--mute);font-weight:400}
.spell{margin:8px 0;padding:6px 12px;border-left:4px solid var(--gold);background:var(--gold-wash-1);font-size:14px;border-radius:0 6px 6px 0}
.pts{list-style:none;padding:0;margin:0}.pts li{padding:6px 0;border-bottom:1px solid var(--line);display:grid;grid-template-columns:22px 1fr 40px;gap:8px}.pts li .hint,.pts li .note{grid-column:2/4;color:var(--mute);font-size:13px}
.pts .yes{color:var(--ok);font-weight:700}.pts .no{color:var(--bad);font-weight:700}.pts .m{color:var(--mute);text-align:right}
.result .scroll{overflow-x:auto}.result table{border-collapse:collapse;font-family:var(--mono);font-size:12px;margin-bottom:10px}.result th{text-align:left;background:var(--tint);padding:3px 6px;border:1px solid var(--line)}.result td{padding:2px 6px;border:1px solid var(--line);white-space:nowrap}
.same{color:var(--ok);font-weight:700}.diff{color:var(--bad);font-weight:700}
.walk{margin:10px 0 0;padding-left:20px}.walk li{margin-bottom:4px}
.bullets{margin:6px 0 10px;padding:8px 12px;background:var(--tint);border-radius:8px;font-family:var(--mono);font-size:13px;white-space:pre-wrap}
.flag{position:fixed;right:34px;bottom:22px;background:var(--white);border:1px solid var(--navy);color:var(--navy);border-radius:999px;padding:8px 16px;font-size:14px;z-index:5;box-shadow:0 1px 4px var(--shadow-a08)}
.flag.on{background:var(--bad-wash-1);border-color:var(--bad);color:var(--bad)}
.dots::after{content:"";animation:d 1.2s steps(4,end) infinite}@keyframes d{0%{content:""}25%{content:"."}50%{content:".."}75%{content:"..."}}
.guard{display:flex;align-items:center;justify-content:center;height:100%;font-size:20px;color:var(--mute);text-align:center;padding:20px}
.guard .box{max-width:560px;display:flex;flex-direction:column;gap:14px;align-items:center}
.guard .box p{margin:0}
.guard input{font-size:17px;padding:8px 12px;border:1px solid var(--line);border-radius:8px;width:280px}
.ev .line{display:grid;grid-template-columns:1fr 320px;gap:14px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.seg{display:flex;gap:6px}.seg button{border:1px solid var(--line);background:var(--white);border-radius:8px;padding:7px 10px;color:var(--ink)}.seg button.on{background:var(--navy);color:var(--white);border-color:var(--navy)}
textarea.comment{width:100%;font:inherit;padding:10px;border:1px solid var(--line);border-radius:8px;resize:none;height:64px}
.count{font-size:13px;color:var(--mute)}
.note{font-size:13px;color:var(--mute)}
.err{color:var(--bad)}
/* staff */
.staff table.grid{border-collapse:collapse;width:100%;font-size:13px;background:var(--white)}.staff .grid th,.staff .grid td{border:1px solid var(--line);padding:6px 8px;text-align:left}.staff .grid th{background:var(--tint)}
.staff td.c{text-align:center;font-family:var(--mono);cursor:pointer;white-space:nowrap}.staff td.c:hover{background:var(--navy-wash-5)}.staff td.c small{color:var(--mute);margin-left:4px}.staff td.c.empty{cursor:default;color:var(--mute)}.staff td.c.empty:hover{background:none}
.staff .tg{font-size:10px;font-weight:700;padding:0 5px;border-radius:4px;margin-left:5px;background:var(--tint);border:1px solid var(--line);font-family:var(--sans)}.staff .tg.red{background:var(--bad-wash-1);color:var(--bad);border-color:var(--bad-edge)}
.staff .amber{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--warn);margin-left:5px;vertical-align:middle}
.staff tr.me td{background:var(--navy-wash-1)}
.stabs{display:flex;gap:4px;margin-bottom:14px;border-bottom:1px solid var(--line)}.stabs button{border:1px solid var(--line);border-bottom:0;background:var(--white);border-radius:8px 8px 0 0;padding:8px 16px;color:var(--ink)}.stabs button.on{background:var(--navy);color:var(--white);border-color:var(--navy)}
.stabs .cls{margin-left:auto;display:flex;align-items:center;gap:8px;font-size:14px;padding-bottom:4px}
.stabs select{padding:5px 8px;border:1px solid var(--line);border-radius:6px}
.clist{list-style:none;padding:0;margin:0 0 16px}.clist li{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 14px;background:var(--white);border:1px solid var(--line);border-radius:10px;margin-bottom:8px}.clist li b{margin-right:auto}
.plist{list-style:none;padding:0;margin:0 0 12px}.plist li{display:grid;grid-template-columns:1fr 90px 90px 110px;gap:10px;align-items:center;padding:8px 14px;background:var(--white);border:1px solid var(--line);border-radius:8px;margin-bottom:6px}
.plist .st{font-size:13px;font-weight:700}.plist .st.on{color:var(--ok)}.plist .st.off{color:var(--mute)}
.drawer{position:fixed;top:52px;right:0;bottom:0;width:min(640px,60vw);background:var(--white);border-left:1px solid var(--line);box-shadow:-4px 0 18px var(--shadow-a08);overflow:auto;padding:18px 22px;z-index:6}
.drawer .part{border-top:1px solid var(--line);padding:12px 0}
.drawer pre{white-space:pre-wrap;font-family:var(--mono);font-size:13px;background:var(--grey-50);border:1px solid var(--line);border-radius:6px;padding:8px 10px;margin:6px 0}
.passbox{max-width:420px;margin:60px auto;display:flex;flex-direction:column;gap:12px}
.passbox input{padding:9px 12px;border:1px solid var(--line);border-radius:8px;font-size:16px}
/* lesson (Beat 2) */
.banner{background:var(--gold-wash-3);border:1px solid var(--gold-edge-1);border-radius:10px;padding:12px 16px;margin-bottom:14px;font-size:14px}
.lesson .ltask{font-size:16px;font-weight:600;margin-bottom:12px}
.steps{list-style:none;padding:0;margin:0 0 16px;display:flex;gap:6px;flex-wrap:wrap}

/* ---- cw.css: the coursework guide ---- */
/* Coursework guide: chapter pages, in the platform's register. Loads after style.css. */
.cw{max-width:1040px}
.cw-num{font-size:13px;letter-spacing:.04em;text-transform:uppercase;color:var(--mute);margin:0 0 2px}
.cw h1{margin:0 0 6px}
.cw .sub{font-size:17px;color:var(--ink);max-width:72ch;margin:0 0 6px}
.cw-marks{font-size:13px;color:var(--mute);margin:0 0 14px}
.cw-top{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin:0 0 22px}
.cw-need ul{margin:8px 0 0;padding-left:20px}
.cw-need li{margin:4px 0}
.cw-words dl{margin:8px 0 0;display:grid;grid-template-columns:max-content 1fr;gap:4px 14px;font-size:14px}
.cw-words dt{font-weight:600;font-family:var(--mono);font-size:13px}
.cw-words dd{margin:0;color:var(--ink)}
.cw-stage{scroll-margin-top:76px;margin:0 0 34px;padding-top:6px}
.cw-stage h2{display:flex;align-items:center;gap:10px;margin:0 0 12px;padding-bottom:8px;border-bottom:2px solid var(--line)}
.cw-stage h2 i{width:28px;height:28px;border-radius:50%;background:var(--navy);color:var(--white);font-style:normal;font-size:14px;display:grid;place-items:center;flex:none}
.cw p{max-width:76ch;line-height:1.55;margin:0 0 12px}
.cw p code,.cw li code,.cw td code{font-family:var(--mono);font-size:13px;background:var(--grey-90);padding:1px 5px;border-radius:4px}
/* a short piece of code never breaks across two lines */
.cw code.nw{white-space:nowrap}
.cw-rule{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;align-items:center;background:var(--gold-wash-3);border:1px solid var(--gold-edge-1);border-left:5px solid var(--gold);border-radius:8px;padding:10px 14px;margin:14px 0 16px;max-width:76ch}
.cw-rule b{font-size:12px;letter-spacing:.04em;text-transform:uppercase;color:var(--gold-deep-1);white-space:nowrap}
.cw-rule span{font-size:15px}
/* steps */
.cw-steps{list-style:none;margin:6px 0 16px;padding:0;max-width:86ch}
.cw-steps li{display:grid;grid-template-columns:34px minmax(0,1fr);gap:0 10px;padding:9px 0;border-top:1px solid var(--line)}
.cw-steps li:first-child{border-top:0}
.cw-steps .tick{width:26px;height:26px;border-radius:50%;border:2px solid var(--line);background:var(--card);color:var(--ink);font:600 12px/1 var(--sans);display:grid;place-items:center;cursor:pointer;padding:0;margin-top:1px}
.cw-steps .tick:hover{border-color:var(--navy)}
.cw-steps li.on .tick{background:var(--ok);border-color:var(--ok);color:var(--white)}
.cw-steps li.on .tick span{display:none}
.cw-steps li.on .tick::before{content:"\2713 "}
.cw-steps .do{font-size:15px;line-height:1.5}
.cw-step-copy{margin:8px 0 2px}
.cw-step-copy .btn{font-size:14px;padding:7px 14px}
.cw-steps li.on .do{color:var(--mute)}
.cw-see{margin:8px 0 2px;padding:8px 12px;border-left:4px solid var(--ok);background:var(--ok-wash-3);border-radius:0 8px 8px 0;font-size:14px;line-height:1.5}
.cw-see>b:first-child{color:var(--ok);margin-right:6px;white-space:nowrap}
.cw-see>b.lg{white-space:normal}
/* code */
.cw-code{background:var(--card);border:1px solid var(--line);border-radius:10px;margin:14px 0 18px;overflow:hidden}
.cw-code-head{display:flex;align-items:center;gap:10px;padding:8px 12px;border-bottom:1px solid var(--line);background:var(--tint)}
.cw-code-head .t{font-weight:600;font-size:14px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cw-code-head .lang{font-size:11px;color:var(--mute);letter-spacing:.04em;text-transform:uppercase}
.kind{font-size:12px;font-weight:600;padding:3px 10px;border-radius:999px;white-space:nowrap}
.kind.copy{background:var(--navy);color:var(--white)}
.kind.type{background:var(--gold);color:var(--ink)}
.kind.turn{background:var(--ok-wash-2);color:var(--ok);border:1px solid var(--ok)}
.kind.read{background:var(--white);color:var(--navy);border:1px solid var(--navy)}
.btn.sm{padding:5px 12px;font-size:13px;border-radius:7px}
.btn.sm.copied{background:var(--ok);border-color:var(--ok);color:var(--white)}
.cw-pre{margin:0;padding:10px 0;font-family:var(--mono);font-size:13px;line-height:1.5;overflow-x:auto;counter-reset:ln;tab-size:4}
.cw-pre .ln{display:block;padding:0 14px 0 54px;position:relative;white-space:pre-wrap;overflow-wrap:anywhere;min-height:1.5em}
.cw-pre .ln::before{counter-increment:ln;content:counter(ln);position:absolute;left:0;width:40px;text-align:right;color:var(--grey-400);font-size:12px;user-select:none}
.cw-pre .ln.f{background:var(--hl);box-shadow:inset 4px 0 0 var(--gold)}
.cw-pre .ln.hi{background:var(--navy-wash-6)}
.cw-pre .ln.f.hi{background:var(--hl-strong)}
.cw-pre .ln .nm{position:absolute;right:10px;top:2px;width:17px;height:17px;border-radius:50%;background:var(--navy);color:var(--white);font:600 10px/17px var(--sans);text-align:center;font-style:normal}
.cw-pre .ln.f .nm{background:var(--gold-deep-1)}
.cw-code.greyed .ln:not(.f){color:var(--grey-600)}
.tok-k{color:var(--cs-key);font-weight:600}.tok-s{color:var(--cs-str)}.tok-c{color:var(--cs-comment);font-style:italic}.tok-n{color:var(--cs-num)}.tok-v{color:var(--cs-type)}
.cw-why{display:flex;gap:10px;align-items:flex-start;padding:9px 14px;border-top:1px solid var(--line);background:var(--gold-wash-2);font-size:13.5px;line-height:1.5;color:var(--gold-deep-3)}
.cw-why b{white-space:nowrap;color:var(--gold-deep-1)}
.cw-notes{margin:0;padding:8px 14px 10px;border-top:1px solid var(--line);list-style:none;display:grid;gap:4px;font-size:13.5px;line-height:1.45}
.cw-notes li{display:grid;grid-template-columns:62px 1fr;gap:8px;padding:3px 6px;border-radius:6px;cursor:default}
.cw-notes li:hover{background:var(--navy-wash-4)}
.cw-notes li b{color:var(--navy);font-weight:600;white-space:nowrap}
.cw-notes li b i{display:inline-grid;place-items:center;width:17px;height:17px;border-radius:50%;background:var(--navy);color:var(--white);font:600 10px/1 var(--sans);font-style:normal;margin-right:4px;vertical-align:1px}
/* your turn */
.cw-turn{padding:12px 14px 6px}
.cw-turn ol{margin:0 0 10px;padding-left:22px}
.cw-turn ol li{margin:4px 0;line-height:1.5}
.cw-turn .tst,.cw-turn .exp,.cw-turn .hint{padding:8px 12px;border-radius:8px;margin:0 0 8px;font-size:14px;line-height:1.5}
.cw-turn .tst{background:var(--tint);border:1px solid var(--line)}
.cw-turn .exp{background:var(--ok-wash-3);border-left:4px solid var(--ok)}
.cw-turn .hint{background:var(--gold-wash-3);border-left:4px solid var(--gold)}
.cw-turn b.lab{display:inline-block;min-width:92px;margin-right:10px;color:var(--mute);font-size:12px;letter-spacing:.04em;text-transform:uppercase}
details.reveal{border-top:1px solid var(--line)}
details.reveal>summary{cursor:pointer;padding:10px 14px;font-weight:600;color:var(--navy);list-style:none;display:flex;align-items:center;gap:8px}
details.reveal>summary::before{content:"\25b8 ";font-size:12px}
details.reveal[open]>summary::before{content:"\25be "}
details.reveal>summary::-webkit-details-marker{display:none}
details.reveal .cw-code{margin:0;border:0;border-top:1px solid var(--line);border-radius:0}
/* fold-outs */
.cw-wrongs{margin:4px 0 16px;max-width:86ch}
details.cw-wrong{border:1px solid var(--line);border-radius:8px;background:var(--card);margin:0 0 6px}
details.cw-wrong>summary{cursor:pointer;padding:8px 12px;font-size:14px;list-style:none;display:flex;gap:8px;align-items:baseline}
details.cw-wrong>summary::-webkit-details-marker{display:none}
details.cw-wrong>summary b{color:var(--bad);font-size:12px;letter-spacing:.04em;text-transform:uppercase;white-space:nowrap}
details.cw-wrong>summary::after{content:"\25b8 ";margin-left:auto;color:var(--mute);font-size:12px}
details.cw-wrong[open]>summary::after{content:"\25be "}
details.cw-wrong>div{padding:0 12px 10px 12px;font-size:14px;line-height:1.5;color:var(--ink)}
.cw-steps .cw-wrongs{margin:8px 0 0}
/* controls table */
.cw-controls{margin:12px 0 18px;overflow-x:auto}
@media (max-width:760px){.cw-controls td.nm{white-space:normal}}
.cw-controls .fp{font-size:14px;margin:0 0 8px;max-width:86ch}
.cw-controls .fp-props{margin:0 0 12px;font-size:14px}
.cw-controls .fp-props>b{display:block;margin-bottom:6px}
.cw-controls .fp-props ul{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:4px 24px;max-width:720px}
.cw-controls .fp-props li{display:flex;justify-content:space-between;gap:10px;border-bottom:1px dotted var(--line);padding:3px 0}
.cw-controls .fp-props code{font-family:var(--mono);font-size:12.5px;color:var(--ink)}
.cw-controls .fp b{font-family:var(--mono);font-size:13px}
.cw-controls table{width:100%;border-collapse:collapse;background:var(--card);border:1px solid var(--line);border-radius:10px;overflow:hidden;font-size:13.5px}
.cw-controls th{background:var(--tint);text-align:left;padding:8px 10px;font-size:12px;letter-spacing:.03em;text-transform:uppercase;color:var(--mute);border-bottom:1px solid var(--line)}
.cw-controls td{padding:7px 10px;border-top:1px solid var(--line);vertical-align:top;line-height:1.45}
.cw-controls td.nm{font-family:var(--mono);font-size:13px;white-space:nowrap}
.cw-controls td .set{display:block;font-family:var(--mono);font-size:12.5px}
.cw-controls td .note{display:block;color:var(--mute);font-size:12.5px;margin-top:2px}
/* prove it */
.cw-check{width:100%;border-collapse:collapse;background:var(--card);border:1px solid var(--line);border-radius:10px;overflow:hidden;font-size:14px;margin:10px 0 16px}
.cw-check th{background:var(--tint);text-align:left;padding:8px 10px;font-size:12px;letter-spacing:.03em;text-transform:uppercase;color:var(--mute);border-bottom:1px solid var(--line)}
.cw-check td{padding:8px 10px;border-top:1px solid var(--line);vertical-align:top;line-height:1.45}
.cw-check td.t{width:34px}
.cw-check .fix{margin:6px 0 0;padding-top:6px;border-top:1px dashed var(--line);font-size:13px}
.cw-check .fix b{color:var(--fix-ink);margin-right:4px}
.cw-check .tick{width:24px;height:24px;border-radius:50%;border:2px solid var(--line);background:var(--card);cursor:pointer;padding:0;color:var(--white);font:600 12px/1 var(--sans)}
.cw-check tr.on .tick{background:var(--ok);border-color:var(--ok)}
.cw-check tr.on .tick::before{content:"\2713 "}

.ex{display:inline-block;font-size:12px;font-weight:600;padding:2px 9px;border-radius:999px;white-space:nowrap}

.ex.control{background:var(--bad-wash-1);color:var(--bad)}

.cw-shot .frame{border:2px dashed var(--grey-300);border-radius:8px;background:repeating-linear-gradient(135deg,var(--grey-60) 0 12px,var(--grey-70) 12px 24px);display:grid;place-items:center;text-align:center;padding:16px;color:var(--mute);font-size:13px;max-width:100%}
.cw-shot .frame b{display:block;font-size:12px;letter-spacing:.08em;color:var(--grey-510);margin-bottom:6px}
.cw-shot .cap{font-size:13px;color:var(--mute);margin:6px 0 0}
.cw-build .cw-shot{margin:0 0 20px}
/* boxes */
.cw-box{margin:12px 0 18px}
.cw-box h3{margin:0 0 6px}
.cw-box p{margin:0 0 8px}
details.cw-box>summary{cursor:pointer;font-weight:600;font-size:15px;list-style:none;display:flex;gap:8px;align-items:center}
details.cw-box>summary::before{content:"\25b8 ";font-size:12px;color:var(--mute)}
details.cw-box[open]>summary::before{content:"\25be "}
details.cw-box>summary::-webkit-details-marker{display:none}
details.cw-box>div{margin-top:8px}
/* clash timeline */
.clash{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px 16px 12px;margin:12px 0 16px;user-select:none}
.clash .lane-h{display:flex;justify-content:space-between;font-size:13px;color:var(--mute);margin:0 0 4px}
.clash .lane-h b{color:var(--ink)}
.clash .axis{position:relative;height:18px;margin:0 0 2px}
.clash .axis span{position:absolute;transform:translateX(-50%);font-size:11px;color:var(--mute);font-family:var(--mono)}
.clash .now-line{margin:10px 0 6px;font-size:14px;color:var(--ink)}
.clash .blk .lbl{font-variant-numeric:tabular-nums;font-size:12px}
.clash .blk .nm{font-weight:700;font-size:12px;letter-spacing:.01em}
.clash .lane{position:relative;height:64px;background:var(--grey-60);border:1px solid var(--line);border-radius:8px;overflow:hidden;touch-action:none}
.clash .grid i{position:absolute;top:0;bottom:0;width:1px;background:var(--grey-120)}
.clash .blk{position:absolute;top:8px;height:48px;border-radius:7px;display:flex;flex-direction:column;align-items:flex-start;justify-content:center;gap:1px;padding:0 10px;font-size:13px;line-height:1.15;white-space:nowrap;overflow:hidden;box-sizing:border-box}
.clash .old{background:var(--navy-wash-8);border:1px solid var(--navy-edge-2);color:var(--navy)}
.clash .new{background:var(--hl);border:2px solid var(--gold);color:var(--hl-ink);cursor:grab;outline:none}
.clash .new:focus-visible{box-shadow:0 0 0 3px var(--navy-a35)}
.clash .new.bad{border-color:var(--bad);box-shadow:inset 0 0 0 1px var(--bad)}
.clash .new .h{position:absolute;right:0;top:0;bottom:0;width:12px;cursor:ew-resize;background:linear-gradient(90deg,transparent,var(--shadow-a08))}
.clash .new .h::after{content:"";position:absolute;right:4px;top:14px;bottom:14px;width:2px;background:var(--shadow-a35);border-radius:1px}
.clash .read{display:grid;grid-template-columns:1fr auto;gap:6px 18px;align-items:center;margin:12px 0 0;font-family:var(--mono);font-size:13.5px}
.clash .read .cmp{display:flex;gap:10px;align-items:center;padding:6px 10px;border-radius:7px;background:var(--tint)}
.clash .read .cmp .v{font-weight:600;min-width:46px;text-align:right}
.clash .read .cmp.t .v{color:var(--ok)}
.clash .read .cmp.f .v{color:var(--bad)}
.clash .read .cmp .eq{color:var(--mute)}
.clash .res{grid-row:1/3;align-self:stretch;display:grid;place-items:center;text-align:center;padding:8px 16px;border-radius:9px;font:600 15px/1.3 var(--sans);min-width:170px}
.clash .res.ok{background:var(--ok-wash-4);color:var(--ok)}
.clash .res.bad{background:var(--bad-wash-2);color:var(--bad)}
.clash .res small{display:block;font-weight:400;font-size:12px;margin-top:4px;color:inherit;opacity:.85}
.clash .jumps{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0 0;align-items:center}
.clash .jumps span{font-size:13px;color:var(--mute);margin-right:4px}
.clash .jumps button{font:13px var(--sans);padding:5px 11px;border-radius:999px;border:1px solid var(--line);background:var(--card);cursor:pointer;color:var(--ink)}
.clash .jumps button:hover{border-color:var(--navy)}
.clash .help{font-size:12.5px;color:var(--mute);margin:8px 0 0}
/* foot */
.cw-foot{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:28px 0 0;padding-top:16px;border-top:2px solid var(--line)}
.cw-foot .sp{flex:1}
.cw-foot .done{background:var(--ok);border-color:var(--ok)}
.cw-foot .clear{font-size:13px;color:var(--mute);background:none;border:0;text-decoration:underline;cursor:pointer;font-family:var(--sans)}
.cw-foot .ask{font-size:13px;display:flex;gap:6px;align-items:center}
/* chapter list */
.fp-props .fp-load{margin:10px 0 0;font-size:14px}
.cw-list{list-style:none;margin:14px 0 22px;padding:0;max-width:900px}
.cw-list li{display:grid;grid-template-columns:44px 1fr 140px;gap:12px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 16px;margin:0 0 8px}
.cw-list li.soon{opacity:.6}
.cw-list li .n{font:600 18px var(--sans);color:var(--navy)}
.cw-list li h3{margin:0 0 2px}
.cw-list li p{margin:0;font-size:13.5px;color:var(--mute)}
.cw-list li .st{justify-self:end;display:flex;gap:6px;align-items:center}
.cw-list li a.btn{text-decoration:none}
.cw-files{max-width:900px}
.cw-files ul{margin:8px 0 0;padding:0;list-style:none}
.cw-files li{display:grid;grid-template-columns:230px 1fr;gap:12px;padding:6px 0;border-top:1px solid var(--line);font-size:14px}
.cw-files li:first-child{border-top:0}
.cw-files a{font-family:var(--mono);font-size:13px;color:var(--navy)}
@media (max-width:900px){.cw-top{grid-template-columns:1fr}.cw-list li{grid-template-columns:36px 1fr}.cw-list li .st{grid-column:2}}
@media print{
  header.bar,#sys,.cw-stages,.btn,.cw-foot,.clash .jumps,.clash .help,.tick{display:none !important}
  .app{min-width:0}main{overflow:visible;padding:0}
  .cw{max-width:none}
  details>summary{list-style:none}
  details.cw-wrong>summary::after,details.reveal>summary::before,details.cw-box>summary::before{content:""}
  .cw-code,.cw-steps li,.cw-controls table,.cw-check tr,.cw-shot,.cw-rule,.clash{break-inside:avoid}
  .cw-pre{white-space:pre-wrap}
  .cw-pre .ln{white-space:pre-wrap}
  .cw-stage{break-before:page}
  .cw-stage:first-of-type{break-before:auto}
  .cw-steps li{grid-template-columns:1fr}
  a{color:inherit;text-decoration:none}
}

/* ===== version 2: screens, walkthroughs, marked screenshots ===== */
.cw .sub{margin-bottom:10px}
/* stage strip: a pill per stage with a dot per screen */
.cw-stages{position:sticky;top:-22px;z-index:5;background:var(--bg);margin:0 -4px 18px;padding:8px 4px 8px;border-bottom:1px solid var(--line);list-style:none;display:flex;flex-wrap:wrap;gap:6px 8px}
.cw-stages li{display:flex;align-items:center;gap:6px;padding:0;border:0;background:none;cursor:default}
.cw-stages .cw-pill{display:flex;align-items:center;gap:0;font:13px var(--sans);padding:5px 6px;transition:padding .25s;border:1px solid var(--line);border-radius:999px;background:var(--card);cursor:pointer;color:var(--ink)}
.cw-stages .cw-pill i{width:20px;height:20px;border-radius:50%;background:var(--grey-110);color:var(--ink);font-style:normal;font-size:12px;font-weight:600;display:grid;place-items:center;flex:none}
.cw-stages .cw-pill .tt{max-width:0;overflow:hidden;white-space:nowrap;opacity:0;transition:max-width .25s,opacity .2s}
.cw-stages li.now .cw-pill{border-color:var(--navy);box-shadow:inset 0 0 0 1px var(--navy)}
.cw-stages li.now .cw-pill{padding-right:11px}.cw-stages li.now .cw-pill .tt{max-width:420px;opacity:1;margin-left:7px}
.cw-stages li.now .cw-pill i{background:var(--navy);color:var(--white)}
.cw-stages li.ok .cw-pill i{background:var(--ok);color:var(--white)}
.cw-stages li.ok .cw-pill i::before{content:"\2713 "}
.cw-stages li.ok .cw-pill i span{display:none}
.cw-stages .cw-dots{display:flex;gap:4px;align-items:center}
.cw-stages .dot{width:10px;height:10px;border-radius:50%;border:1.5px solid var(--grey-300);background:var(--card);padding:0;cursor:pointer}
.cw-stages .dot.ok{background:var(--ok);border-color:var(--ok)}
.cw-stages .dot.now{background:var(--navy);border-color:var(--navy);transform:scale(1.25)}
.cw-stages .dot:hover{border-color:var(--navy)}
/* one screen at a time */
.cw-screen[hidden]{display:none}
.cw-where{font-size:12.5px;letter-spacing:.03em;text-transform:uppercase;color:var(--mute);margin:4px 0 4px}
.cw-screen h2{margin:0 0 14px;padding-bottom:8px;border-bottom:2px solid var(--line);font-size:24px;line-height:1.25;max-width:80ch}
.cw-screen>p{font-size:16px;max-width:76ch}
.cw-need,.cw-words{margin:0 0 16px;max-width:860px}
.cw-need ul{margin:8px 0 0;padding-left:20px}
.cw-need li{margin:6px 0;line-height:1.5}
.cw-nav{display:flex;flex-wrap:wrap;gap:12px;align-items:stretch;margin:30px 0 0;padding-top:16px;border-top:2px solid var(--line)}
.cw-nav .sp{flex:1}
.cw-nav a.btn{display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-decoration:none;min-width:200px;max-width:380px;padding:9px 16px;line-height:1.3}
.cw-nav a.btn.next{align-items:flex-end;text-align:right}
.cw-nav a.btn small{font-weight:400;font-size:12.5px;opacity:.85;white-space:normal}
.cw-end{display:flex;flex-wrap:wrap;gap:10px;align-items:center;width:100%;padding-top:12px;border-top:1px dashed var(--line)}
.cw-end .done{background:var(--ok);border-color:var(--ok)}
.cw-end .clear{font-size:13px;color:var(--mute);background:none;border:0;text-decoration:underline;cursor:pointer;font-family:var(--sans)}
.cw-end .ask{font-size:13px;display:flex;gap:6px;align-items:center}
.cw-end .cnt{flex:1}
/* marked screenshots */
.cw-shot .pic{position:relative;display:block}
.cw-shot .pic img{width:100%;max-width:none}
.cw-shot .mk{position:absolute;pointer-events:none}
.cw-shot .mk.ring{width:34px;height:34px;border:3px solid var(--gold);border-radius:50%;transform:translate(-50%,-50%);box-shadow:0 0 0 2px var(--white-a90),0 0 0 2px var(--shadow-a08) inset}
.cw-shot .mk.box{border:3px solid var(--gold);border-radius:7px;box-shadow:0 0 0 2px var(--white-a90)}
.cw-shot .mk i{position:absolute;left:-12px;top:-12px;width:24px;height:24px;border-radius:50%;background:var(--gold);color:var(--ink);font:700 13px/24px var(--sans);text-align:center;font-style:normal;box-shadow:0 1px 3px var(--shadow-a30)}
.cw-shot .mk.ring i{left:-16px;top:-16px}
/* a box keeps its words clear: the badge sits just above its top-left corner (beside it when the box touches the top; inside only in the very corner) */
.cw-shot .mk.box i{left:-6px;top:-27px}.cw-shot .mk.box.side i{left:-28px;top:-3px}.cw-shot .mk.box.corner i{left:-12px;top:-12px}.cw-shot .mk.box.inside i{left:5px;top:5px}
.mk-list{list-style:none;margin:8px 0 0;padding:0;display:grid;gap:5px;max-width:86ch}
.mk-list li{display:grid;grid-template-columns:24px 1fr;gap:10px;align-items:start;font-size:14.5px;line-height:1.5}
.mk-list li i{width:24px;height:24px;border-radius:50%;background:var(--gold);color:var(--ink);font:700 13px/24px var(--sans);text-align:center;font-style:normal}
.cw-shot .frame .mk-list{text-align:left;margin-top:10px}
.cw-steps .cw-shot{margin:10px 0 6px}
.cw-steps .do{font-size:15.5px}
/* the walkthrough */
.cw-walk{border-top:1px solid var(--line)}
.cw-walk .wtop{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;padding:8px 14px;background:var(--navy-wash-3);border-bottom:1px solid var(--line)}
.cw-walk .wtop .q{font-weight:700;color:var(--navy);font-size:14px}
.cw-walk .wtop .hint{font-size:13px;color:var(--mute);flex:1}
.cw-walk .wgrid{position:relative;display:block}
.cw-walk .wgrid .code{width:calc(100% - 332px);min-width:0}
.cw-walk .wgrid .code .cw-pre{padding-right:0}
.cw-walk .wgrid .cards{position:absolute;top:0;right:0;width:300px;height:100%}
.cw-walk .leads{position:absolute;left:0;top:0;pointer-events:none;overflow:visible}
.cw-walk .leads path{fill:none;stroke:var(--grey-420);stroke-width:1.5}
.cw-walk .leads g.hi path,.cw-walk .leads g.on path{stroke:var(--navy);stroke-width:2.2}
.cw-walk .leads g.on .br{stroke:var(--navy);stroke-width:3}
.cw-walk .leads g.off{opacity:.18}
.wcard{position:absolute;right:12px;width:288px;box-sizing:border-box;background:var(--card);border:1px solid var(--line);border-left:4px solid var(--grey-200);border-radius:8px;padding:8px 10px 8px 10px;font-size:13.5px;line-height:1.45;cursor:pointer;transition:border-color .15s,box-shadow .15s,opacity .2s}
.wcard b{display:flex;gap:7px;align-items:center;color:var(--navy);font-size:13.5px;margin:0 0 2px}
.wcard b i{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;background:var(--navy);color:var(--white);font:600 11px/1 var(--sans);font-style:normal;flex:none}
.wcard .ls{display:block;font-size:11.5px;color:var(--mute);margin:0 0 4px}
.wcard p{margin:0;max-width:none;line-height:1.45;font-size:13.5px}
.wcard p code{font-size:12px}
.wcard.hi{border-left-color:var(--navy);box-shadow:0 2px 10px var(--navy-a15)}
.wcard.on{border-left-color:var(--navy);border-color:var(--navy);box-shadow:0 3px 14px var(--navy-a28);background:var(--navy-wash-3)}
.wcard.on b i{background:var(--navy)}
.wcard.off{opacity:.35}
.cw-walk .cw-pre .ln.dim{opacity:.32}
.cw-walk .cw-pre .ln.lit{background:var(--navy-wash-7);box-shadow:inset 4px 0 0 var(--navy)}
.cw-walk .cw-pre .ln.f.lit{background:var(--hl-strong);box-shadow:inset 4px 0 0 var(--navy)}
.cw-walk .cw-pre .ln.f.dim{opacity:.4}
.cw-walk .wbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding:10px 14px;border-top:1px solid var(--line);background:var(--tint)}
.cw-walk .wbar .n{font-weight:600;font-size:14px;color:var(--navy);min-width:100px}
.cw-walk .wbar .all{margin-left:auto}
.cw-walk .wgrid.stacked .code{width:100%}
.cw-walk .wgrid.stacked .cards{position:static;width:auto;height:auto;display:grid;gap:8px;padding:10px 12px 12px;border-top:1px solid var(--line)}
.cw-walk .wgrid.stacked .wcard{position:static;width:auto}
.cw-walk .wgrid.stacked .leads{display:none}
/* the drawn picture of the overlap rule */
.cw-overlap{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px 16px 8px;margin:12px 0 18px;max-width:860px}
.cw-overlap svg{width:100%;height:auto;display:block;font-family:var(--sans)}
.cw-overlap .tick{stroke:var(--grey-120);stroke-width:1}
.cw-overlap .ax{font-size:12px;fill:var(--mute);text-anchor:middle;font-family:var(--mono)}
.cw-overlap rect.old{fill:var(--navy-wash-8);stroke:var(--navy-edge-2);stroke-width:1.5}
.cw-overlap rect.new{fill:var(--hl);stroke:var(--gold);stroke-width:2}
.cw-overlap text.in{font-size:13px;font-weight:600;text-anchor:middle;fill:var(--navy)}
.cw-overlap text.tl{font-size:12.5px;font-weight:600;font-family:var(--mono)}
.cw-overlap text.tl.old{fill:var(--navy)}
.cw-overlap text.tl.new{fill:var(--gold-deep-1)}
.cw-overlap g.half line.guide{stroke:var(--grey-420);stroke-width:1.2;stroke-dasharray:4 3}
.cw-overlap g.half line.span{stroke:var(--grey-420);stroke-width:2}
.cw-overlap g.half circle{fill:var(--grey-420)}
.cw-overlap g.half circle.bd{fill:var(--navy)}
.cw-overlap g.half text.bn{font-size:12px;font-weight:700;fill:var(--white);text-anchor:middle}
.cw-overlap g.half.hi line{stroke:var(--navy)}
.cw-overlap g.half.hi circle{fill:var(--navy)}
.cw-overlap g.half.hi circle.bd{fill:var(--gold)}
.cw-overlap g.half.hi text.bn{fill:var(--ink)}
.cw-overlap .halves{list-style:none;margin:6px 0 0;padding:0;display:grid;gap:8px}
.cw-overlap .halves li{display:grid;grid-template-columns:26px 1fr;gap:10px;align-items:start;padding:8px 10px;border-radius:8px;border:1px solid var(--line);cursor:default}
.cw-overlap .halves li.hi{border-color:var(--navy);background:var(--navy-wash-2)}
.cw-overlap .halves li i{width:24px;height:24px;border-radius:50%;background:var(--navy);color:var(--white);font:700 12px/24px var(--sans);text-align:center;font-style:normal}
.cw-overlap .halves code{display:inline-block;font-family:var(--mono);font-size:13px;background:var(--grey-90);padding:2px 7px;border-radius:4px;margin:0 0 4px}
.cw-overlap .halves p{margin:0;font-size:14.5px;line-height:1.5;max-width:none}
.cw-overlap .after{margin:12px 0 6px;font-size:15px}
/* clash read-out in words */
.clash .read{display:grid;grid-template-columns:1fr auto;gap:8px 18px;align-items:stretch;margin:12px 0 0;font-family:var(--sans);font-size:14px}
.clash .read .cmp{display:grid;grid-template-columns:1fr auto;gap:2px 12px;align-items:center;padding:8px 12px;border-radius:8px;background:var(--tint);border:1px solid var(--line)}
.clash .read .cmp .q{font-weight:600;color:var(--ink)}
.clash .read .cmp .num{grid-column:1;color:var(--mute);font-size:13.5px}
.clash .read .cmp code{grid-column:1;font-family:var(--mono);font-size:12px;color:var(--mute)}
.clash .read .cmp .v{grid-column:2;grid-row:1/4;font:700 20px var(--sans);min-width:46px;text-align:center;padding:6px 10px;border-radius:8px}
.clash .read .cmp.t .v{color:var(--white);background:var(--ok)}
.clash .read .cmp.f .v{color:var(--white);background:var(--grey-510)}
.clash .res{grid-row:1/3;align-self:stretch;display:grid;place-items:center;text-align:center;padding:10px 16px;border-radius:9px;min-width:200px;max-width:260px}
.clash .res b{font-size:17px;display:block}
.clash .res small{display:block;font-weight:400;font-size:12.5px;line-height:1.4;margin-top:4px}
@media (max-width:760px){.clash .read{grid-template-columns:1fr}.clash .res{grid-row:auto;max-width:none}}
@media print{
  .cw-screen{display:block !important;break-before:page}
  .cw-screen:first-child{break-before:auto}
  .cw-nav,.cw-walk .wtop .btn,.cw-walk .wbar,.cw-stages{display:none !important}
  .cw-walk .wgrid .code{width:100%}
  .cw-walk .wgrid{height:auto !important}
  .cw-walk .wgrid .cards{position:static;width:auto;height:auto;display:grid;gap:6px;padding:8px 12px}
  .cw-walk .wcard{position:static !important;width:auto}
  .cw-walk .leads{display:none}
  .wcard.off,.cw-walk .cw-pre .ln.dim{opacity:1}
  .cw-stage{break-before:auto}
}

/* LEDGER (chapter 8) */
.cw-ledger{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin:12px 0 18px;max-width:860px}
.cw-ledger .lg-h{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:10px;font-weight:600;color:var(--navy)}
.cw-ledger .lg-sw{font:inherit;font-weight:600;padding:7px 14px;border-radius:8px;border:2px solid var(--gold);background:var(--gold-wash-4);color:var(--gold-deep-2);cursor:pointer}
.cw-ledger.off .lg-sw{background:var(--navy);border-color:var(--navy);color:var(--white)}
.cw-ledger .lg-t{width:100%;border-collapse:collapse;font-size:15px}
.cw-ledger .lg-t th{text-align:left;font-size:13px;color:var(--mute);font-weight:600;padding:6px 8px;border-bottom:2px solid var(--line)}
.cw-ledger .lg-t td{padding:8px;border-bottom:1px solid var(--line);vertical-align:top;animation:lgin .35s ease both;animation-delay:calc(var(--i) * 120ms)}
.cw-ledger .lg-t td.ch,.cw-ledger .lg-t td.q{font-family:var(--mono);width:120px}
.cw-ledger .lg-t td.q{font-weight:700;font-size:17px;color:var(--navy)}
.cw-ledger tr.refused td{background:var(--bad-wash-3)}
.cw-ledger tr.refused td.ch{text-decoration:line-through;color:var(--mute)}
.cw-ledger tr.refused .msg{display:block;margin-top:4px;color:var(--bad-deep);font-weight:600}
.cw-ledger tr.neg td.q{color:var(--bad-strong)}
.cw-ledger tr.neg td{background:var(--bad-wash-4)}
.cw-ledger .lg-line{margin:10px 0 0;color:var(--bad-deep);font-weight:600}
.cw-ledger .lg-print{display:none}
@keyframes lgin{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.cw-ledger .lg-t td{animation:none}}
/* DIAGRAM (chapter 2) */
.cw-diagram{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px;margin:12px 0 18px;max-width:1000px}
.cw-diagram svg{width:100%;height:auto;display:block;font-family:var(--sans)}
.cw-diagram .bx{fill:var(--white);stroke:var(--navy-edge-2);stroke-width:1.5}
.cw-diagram .hd{fill:var(--navy)}
.cw-diagram .tn{fill:var(--white);font-weight:700;font-size:14px}
.cw-diagram .cn{font-size:13px;fill:var(--grey-900);font-family:var(--mono)}
.cw-diagram .cn.pk{font-weight:700}
.cw-diagram .k{font-size:11px;fill:var(--gold-deep-1);text-anchor:end;font-weight:700}
.cw-diagram .ln{fill:none;stroke:var(--gold);stroke-width:2}
.cw-diagram .end{fill:var(--gold)}
.cw-diagram figcaption{font-size:14px;color:var(--mute);margin-top:6px}

/* platform/lessonview.js \u2014 one lesson as one part sees it (D35). Public: lessons carry no exam answers.
 * A lesson holds ONE annotated whole statement (src). Its fragments are tagged with step ids:
 *   \u27eaid|text\u27eb        the text shows once step id is visible for this part AND reached
 *   \u27eaid|then|else\u27eb   else shows while step id is hidden for this part or not yet reached
 *   \u27ea<id|text\u27eb       the text shows only until step id is reached (a placeholder, e.g. a cloze blank)
 *   \u27ea@id\u27eb            a line guard: the whole line shows only once step id is visible and reached
 *   \u27ea@a,b\u27eb           a line guard naming several steps: the line shows once ANY of them is visible and reached

 * A step shows for a part when it has no `need`, or `need` meets the part's skills, no skill of the part is in `not`,

 * (e.g. to print a DEFAULT) or, when the set has no table of that name, adds it; the gate runs the lesson on the seed with the
 * lesson's `gate` SQL applied first.

 * checks every row is in its result (all: the rows are the whole result, in any order). grid may be a list of variants

 * Tokens in any string: {todayIso} 2026-09-27 \u00b7 {todayUK} 27/09/2026 \u00b7 {todayLong} 27 September 2026 \u00b7 {todayDay} Sunday.
 * {mon1Iso} 2026-09-07 \u00b7 {mon1Long} 7 September 2026: the first Monday of this month, the seed's date('now','start of month','weekday 1').
 * {agoIso:N} the date N days before today, 2026-09-15 for {agoIso:12}: the seed's date('now','-N days'), for grid rows.
 * {aheadIso:N} the date N days after today, 2026-10-07 for {aheadIso:10}: the seed's date('now','+N days').

      reach.add(s.id);
      const sql = s.sql != null ? T(s.sql) : src ? T(statement(src, s.whole ? all : reach)) : '';
      const hl = s.hl ? { pane: s.hl.pane || 'lesson', t: (Array.isArray(s.hl.t) ? items(s.hl.t, part)[0] : s.hl.t) || null, f: (s.hl.f || []).concat(...(s.hl.extra || []).filter((x) => meets(x, part)).map((x) => x.f)), say: T(line(joined(s.hl.say), all)) } : null;
