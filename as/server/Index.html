      lits.push(v); return '\u0001' + (lits.length - 1) + '\u0001'; });
    // today
    sql = sql.replace(/\b(?:GETDATE|SYSDATETIME|CURRENT_TIMESTAMP)\s*\(\s*\)/gi, "date('now')").replace(/\bCURRENT_TIMESTAMP\b/gi, "date('now')");
    // CAST(x AS DATE) \u2192 date(x); CAST(x AS INT|DECIMAL\u2026) \u2192 CAST(x AS INTEGER|REAL)
    sql = rewriteCalls(sql, 'CAST', (a, inner) => { const m = /^([\s\S]*?)\s+AS\s+(\w+)(?:\([^)]*\))?\s*$/i.exec(inner); if (!m) return 'CAST(' + inner + ')'; const t = m[2].toLowerCase(); if (t === 'date' || t === 'datetime') return asDate(m[1]); if (/^(int|integer|bigint|smallint|tinyint)$/.test(t)) return 'CAST(' + m[1] + ' AS INTEGER)'; if (/^(decimal|numeric|float|real|money)$/.test(t)) return 'CAST(' + m[1] + ' AS REAL)'; return 'CAST(' + m[1] + ' AS TEXT)'; });
    sql = rewriteCalls(sql, 'CONVERT', (a) => { const t = (a[0] || '').toLowerCase(); if (/^date/.test(t)) return asDate(a[1] || "date('now')"); return '(' + (a[1] || '') + ')'; });
    // DATEADD(unit, n, d) \u2192 date(d, (n) || ' unit')   (WEEK \u2192 days \u00d7 7)
    // MONTH/YEAR clamp to the month's last day as SQL Server does (31 Mar \u2212 1 month = 28 Feb); SQLite alone would roll on to 3 Mar
    sql = rewriteCalls(sql, 'DATEADD', (a) => {
      const u = UNIT[(a[0] || '').toLowerCase()] || 'day'; const n = a[1] || '0'; const d = asDate(a[2] || "date('now')");
      // MINUTE/HOUR keep the time: a time ('17:00', '17:00:00') stays a time, a date-time stays a date-time
      if (u === 'minute' || u === 'hour') { const x = a[2] || "datetime('now')"; return "(CASE WHEN length(" + x + ") <= 8 THEN strftime('%H:%M', " + x + ", (" + n + ") || ' " + u + "s') ELSE datetime(" + x + ", (" + n + ") || ' " + u + "s') END)"; }
      if (u === 'week') return 'date(' + d + ", ((" + n + ") * 7) || ' days')";
      if (u === 'month' || u === 'year') {
        const k = u === 'year' ? '((' + n + ') * 12)' : '(' + n + ')';
        return 'date(' + d + ", 'start of month', " + k + " || ' months', '+' || (min(CAST(strftime('%d', " + d + ") AS INTEGER), CAST(strftime('%d', date(" + d + ", 'start of month', (" + k + " + 1) || ' months', '-1 day')) AS INTEGER)) - 1) || ' days')";
      }
      return 'date(' + d + ', (' + n + ") || ' " + u + "s')";
    });
    // DATEDIFF(unit, a, b)
    sql = rewriteCalls(sql, 'DATEDIFF', (a) => { const u = UNIT[(a[0] || '').toLowerCase()] || 'day'; const x = a[1], y = a[2]; if (u === 'day') return 'CAST(julianday(' + asDate(y) + ') - julianday(' + asDate(x) + ') AS INTEGER)'; if (u === 'week') return "(CAST((julianday(" + asDate(y) + ") - julianday('1899-12-31')) / 7 AS INTEGER) - CAST((julianday(" + asDate(x) + ") - julianday('1899-12-31')) / 7 AS INTEGER))"; if (u === 'month') return "((CAST(strftime('%Y'," + y + ") AS INTEGER) - CAST(strftime('%Y'," + x + ") AS INTEGER)) * 12 + CAST(strftime('%m'," + y + ") AS INTEGER) - CAST(strftime('%m'," + x + ") AS INTEGER))"; if (u === 'year') return "(CAST(strftime('%Y'," + y + ") AS INTEGER) - CAST(strftime('%Y'," + x + ") AS INTEGER))"; if (u === 'minute') return "(CAST(strftime('%s'," + y + ") AS INTEGER) / 60 - CAST(strftime('%s'," + x + ") AS INTEGER) / 60)"; return "(CAST(strftime('%s'," + y + ") AS INTEGER) / 3600 - CAST(strftime('%s'," + x + ") AS INTEGER) / 3600)"; });
    // YEAR/MONTH/DAY(d), DATEPART(unit, d)
    sql = rewriteCalls(sql, 'YEAR', (a) => "CAST(strftime('%Y'," + a[0] + ') AS INTEGER)');
    sql = rewriteCalls(sql, 'MONTH', (a) => "CAST(strftime('%m'," + a[0] + ') AS INTEGER)');
    sql = rewriteCalls(sql, 'DAY', (a) => "CAST(strftime('%d'," + a[0] + ') AS INTEGER)');
    sql = rewriteCalls(sql, 'DATEPART', (a) => { const u = UNIT[(a[0] || '').toLowerCase()] || 'day'; const f = { year: '%Y', month: '%m', day: '%d', week: '%W', minute: '%M', hour: '%H' }[u]; return "CAST(strftime('" + f + "'," + a[1] + ') AS INTEGER)'; });
    // TOP n \u2192 LIMIT n (appended)
    const top = /\bSELECT\s+(DISTINCT\s+)?TOP\s+(\d+)\s+/i.exec(sql);
    if (top) { sql = sql.replace(top[0], 'SELECT ' + (top[1] || '')); sql = sql.replace(/;?\s*$/, ' LIMIT ' + top[2]); }
    // CREATE TABLE bits SQLite lacks: IDENTITY(1,1) \u2192 drop (INTEGER PRIMARY KEY autoincrements); inline FOREIGN KEY REFERENCES \u2192 REFERENCES
    sql = sql.replace(/\bIDENTITY\s*(\(\s*\d+\s*,\s*\d+\s*\))?/gi, '').replace(/\bFOREIGN\s+KEY\s+REFERENCES\b/gi, 'REFERENCES');
    sql = sql.replace(/\b(N?VARCHAR|NCHAR|CHAR)\s*\(\s*(\d+|MAX)\s*\)/gi, 'TEXT').replace(/\bDATETIME2?\b/gi, 'DATE').replace(/\bMONEY\b/gi, 'REAL');
    // DEFAULT GETDATE(): SQLite wants an expression default in brackets
    sql = sql.replace(/\bDEFAULT\s+(date\('now'\))/gi, 'DEFAULT ($1)');
    // string concatenation: 'a' + b \u2192 'a' || b   (only when a literal or a known text column sits on one side)
    sql = sql.replace(/(\u0001\d+\u0001)\s*\+\s*/g, '$1 || ').replace(/\s*\+\s*(\u0001\d+\u0001)/g, ' || $1');
    // ISNULL \u2192 IFNULL, LEN \u2192 LENGTH
    sql = sql.replace(/\bISNULL\s*\(/gi, 'IFNULL(').replace(/\bLEN\s*\(/gi, 'LENGTH(');
    // ORDER BY Name where the SELECT list has t.Name: SQL Server sorts by that output column; SQLite calls it ambiguous
    const sel = /^\s*SELECT\s+(?:DISTINCT\s+)?([\s\S]*?)\bFROM\b/i.exec(sql);
    const ob = /\bORDER\s+BY\s+([\s\S]*?)(\s+LIMIT\s+\d+)?\s*;?\s*$/i.exec(sql);
    if (sel && ob) {
      const q = {};
      args(sel[1]).forEach((it) => { const m = /^(\w+)\.(\w+)$/.exec(it.trim()); if (m) q[m[2].toLowerCase()] = m[1] + '.' + m[2]; });
      const terms = args(ob[1]).map((t) => { const m = /^(\w+)(\s+(?:ASC|DESC))?$/i.exec(t.trim()); return m && q[m[1].toLowerCase()] ? q[m[1].toLowerCase()] + (m[2] || '') : t; });
      sql = sql.slice(0, ob.index) + 'ORDER BY ' + terms.join(', ') + (ob[2] || '') + sql.slice(ob.index + ob[0].length).replace(/^/, /;\s*$/.test(ob[0]) ? ';' : '');
    }
    // statements written without semicolons (SQL Server allows it; SQLite does not): a new line that starts a statement ends the last one
    sql = splitStatements(sql);
    // restore literals
    sql = sql.replace(/\u0001(\d+)\u0001/g, (m, i) => lits[+i]);
    return sql.trim();
  }
  return { convert };
});

</script>
<script>
/* platform/editor.js \u2014 the SQL editor (SPEC 4, his ruling on SSMS colours). A transparent textarea over a coloured <pre>,
 * with a line-number gutter and the current line tinted while focused. Colours as SQL Server Management Studio:
 * keywords #0000FF, built-in functions #FF00FF, strings #FF0000, comments #008000, operators #808080, names and numbers #000000.
 * Enter keeps the indent; Tab inserts 4 spaces. 6 lines tall, grows to 20, then scrolls; long lines scroll sideways (no wrap).
 * window.SqlEditor.create(host, {value, readOnly, placeholder, label, onChange}) -> {get, set, focus, el}
 * window.SqlEditor.html(sql) -> coloured HTML. */
(function () {
  'use strict';
  const KEYWORDS = new Set(('select from where and or not in is null as on join inner left right full outer cross group by having order asc desc distinct top ' +
    'insert into values update set delete create table alter add drop column primary key foreign references constraint unique check default identity ' +
    'int integer smallint bigint varchar nvarchar char nchar date datetime time decimal numeric float money bit text between like exists case when then else end ' +
    'union all go with begin declare').split(' '));
  const FUNCS = new Set(('count sum avg min max getdate dateadd datediff datepart year month day cast convert len upper lower round isnull coalesce substring ' +
    'replace concat abs floor ceiling sysdatetime datename current_timestamp').split(' '));
  const BARE = new Set(['getdate', 'current_timestamp', 'sysdatetime']);
  const LINE = 22.5, MIN = 6, MAX = 20;
  const esc = (s) => s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');

  function html(src) {
    let out = '', i = 0;
    const s = src || '';
    while (i < s.length) {
      const ch = s[i];
      if (ch === '-' && s[i + 1] === '-') { let j = s.indexOf('\n', i); if (j < 0) j = s.length; out += '<span class="c">' + esc(s.slice(i, j)) + '</span>'; i = j; continue; }
      if (ch === '/' && s[i + 1] === '*') { let j = s.indexOf('*/', i + 2); j = j < 0 ? s.length : j + 2; out += '<span class="c">' + esc(s.slice(i, j)) + '</span>'; i = j; continue; }
      if (ch === "'") {
        let j = i + 1;
        while (j < s.length) { if (s[j] === "'" && s[j + 1] === "'") { j += 2; continue; } if (s[j] === "'") { j++; break; } j++; }
        out += '<span class="s">' + esc(s.slice(i, j)) + '</span>'; i = j; continue;
      }
      if (ch === '[') { let j = s.indexOf(']', i); j = j < 0 ? s.length : j + 1; out += '<span class="n">' + esc(s.slice(i, j)) + '</span>'; i = j; continue; }
      if (/[A-Za-z_@#]/.test(ch)) {
        let j = i + 1;
        while (j < s.length && /[\w$]/.test(s[j])) j++;
        const w = s.slice(i, j), lw = w.toLowerCase();
        let cls = 'n';
        if (FUNCS.has(lw) && (/^\s*\(/.test(s.slice(j)) || BARE.has(lw))) cls = 'f';
        else if (KEYWORDS.has(lw)) cls = 'k';
        out += '<span class="' + cls + '">' + esc(w) + '</span>'; i = j; continue;
      }
      if (/[0-9]/.test(ch)) { let j = i + 1; while (j < s.length && /[\d.]/.test(s[j])) j++; out += '<span class="n">' + esc(s.slice(i, j)) + '</span>'; i = j; continue; }
      if (/[=<>!+\-*\/%]/.test(ch)) { out += '<span class="o">' + esc(ch) + '</span>'; i++; continue; }
      out += esc(ch); i++;
    }
    return out + '\n';
  }

  function create(host, opts) {
    opts = opts || {};
    host.classList.add('ed');
    host.innerHTML = '<div class="ed-g"><div class="ed-gi"></div></div><div class="ed-c"><div class="ed-cur"></div><pre></pre></div>';
    const gi = host.querySelector('.ed-gi'), wrap = host.querySelector('.ed-c'), pre = wrap.querySelector('pre'), cur = wrap.querySelector('.ed-cur');
    const gutter = (n) => { let t = ''; for (let k = 1; k <= n; k++) t += k + '\n'; gi.textContent = t; };
    if (opts.readOnly) {
      host.classList.add('ro');
      let val = opts.value || '';
      const show = () => { pre.innerHTML = html(val); gutter(Math.max(1, val.split('\n').length)); };
      show();
      if (opts.label) host.setAttribute('aria-label', opts.label);
      return { el: host, get: () => val, set: (v) => { val = v || ''; show(); }, focus: () => {} };
    }
    const ta = document.createElement('textarea');
    ta.spellcheck = false; ta.wrap = 'off'; ta.placeholder = opts.placeholder || '';
    ta.setAttribute('autocapitalize', 'off'); ta.setAttribute('autocomplete', 'off'); ta.setAttribute('autocorrect', 'off');
    if (opts.label) ta.setAttribute('aria-label', opts.label);
    wrap.appendChild(ta);
    let lines = 0;
    function size() {
      const n = Math.max(1, ta.value.split('\n').length);
      const rows = Math.min(MAX, Math.max(MIN, n));
      ta.style.height = (rows * LINE + 20) + 'px';
      if (n !== lines) { lines = n; gutter(Math.max(n, rows)); }
    }
    function follow() {
      pre.style.transform = 'translate(' + (-ta.scrollLeft) + 'px,' + (-ta.scrollTop) + 'px)';
      gi.style.transform = 'translateY(' + (-ta.scrollTop) + 'px)';
      const row = ta.value.slice(0, ta.selectionStart).split('\n').length - 1;
      cur.style.top = (10 + row * LINE - ta.scrollTop) + 'px';
    }
    function paint(silent) { pre.innerHTML = html(ta.value); size(); follow(); if (!silent && opts.onChange) opts.onChange(ta.value); }
    function put(text) {
      const a = ta.selectionStart, b = ta.selectionEnd;
      ta.setRangeText(text, a, b, 'end');
      paint();
    }
    ta.addEventListener('input', () => paint());
    ta.addEventListener('scroll', follow);
    ['keyup', 'click', 'focus', 'select'].forEach((ev) => ta.addEventListener(ev, follow));
    ta.addEventListener('keydown', (e) => {
      if (e.key === 'Tab' && !e.shiftKey && !e.ctrlKey && !e.metaKey && !e.altKey) { e.preventDefault(); put('    '); return; }
      if (e.key === 'Enter' && !e.shiftKey && !e.ctrlKey && !e.metaKey && !e.altKey && !e.isComposing) {
        const a = ta.selectionStart, start = ta.value.lastIndexOf('\n', a - 1) + 1, indent = /^[ \t]*/.exec(ta.value.slice(start, a))[0];
        e.preventDefault(); put('\n' + indent);
      }
    });
    ta.value = opts.value || '';
    paint(true);
    return { el: host, get: () => ta.value, set: (v) => { ta.value = v || ''; paint(); }, focus: () => ta.focus() };
  }
  window.SqlEditor = { create, html };
})();

</script>
<script>
/* platform/lesson.js \u2014 Beat 2, the lesson (\u00a712a; his prototype look, 26 Sep 2026). Ported from prototype/lesson.js.
 * The lesson announces itself, teaches on the Tinies tables one step per skill, and each step ends in a quick check that reads
 * the EXAM design (never a line of the exam answer). Input is LessonView.view(lesson, part, today): only this part's steps.
 * window.Lesson.render(host, o) -> {destroy}
 *   o: { view, state:{step, done:{id:{how,msg}}, tries:{id:n}, wrong:{id:[picked]}, seed, finished}, save(), onOut(beat), T(key, vars),
 *        figure: { examHtml(), showPane(id), highlight(spec), pickable(pane, kind, cb, otherCb) } }
 * Checks: choose (options shuffled once per state) \u00b7 field (click a field; answer may be a list, D53) \u00b7 table (click a table).
 * A wrong pick shows wrong[picked], then outside, then wrong['*'] (D62) and stays struck out; after two wrong the answer is shown,
 * with every wrong pick still struck. Next opens once the check is settled; Back is always there. */
(function () {
  'use strict';
  const esc = (s) => String(s == null ? '' : s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

  // the statement, one line per row; new lines since the last step marked .new; text answers are not coloured
  function blockHtml(text, prev, isText, extra) {
    const lines = String(text || '').split('\n'), fresh = prev == null ? lines.map(() => false) : LessonView.newLines(text, prev);
    return '<pre class="lsql' + (isText ? ' txt' : '') + (extra ? ' ' + extra : '') + '">' + lines.map((line, i) =>
      '<div class="ln' + (fresh[i] ? ' new' : '') + '">' + (isText ? esc(line) : SqlEditor.html(line).replace(/\n$/, '')) + '</div>').join('') + '</pre>';
  }
  function shuffled(arr, seed) { // stable shuffle per lesson state, so a reload keeps the order
    const a = arr.slice(); let s = seed || 1;
    for (let i = a.length - 1; i > 0; i--) { s = (s * 9301 + 49297) % 233280; const j = Math.floor((s / 233280) * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
    return a;
  }
  const answers = (c) => [].concat(c.answer);
  const tableOf = (f) => String(f).split('.')[0];

  function render(host, o) {
    const V = o.view, T = o.T, st = o.state, steps = V.steps, n = steps.length, isText = V.answer === 'text';
    st.step = Math.min(Math.max(st.step || 0, 0), n - 1);
    st.done = st.done || {}; st.tries = st.tries || {}; st.wrong = st.wrong || {};
    if (!st.seed) st.seed = 1 + (Date.now() % 100000);
    let pickOff = null;

    const settled = (k) => !steps[k].check || !!st.done[steps[k].id];
    function maxReach() { let m = 0; while (m < n - 1 && settled(m)) m++; return m; }

    function strip() {
      const reach = maxReach();
      return '<ol class="steps">' + steps.map((s, k) => {
        const ok = !!st.done[s.id] || (!s.check && k < st.step);
        return '<li class="' + (k < st.step ? 'done' : k === st.step ? 'now' : '') + (ok ? ' ok' : '') + '"' + (k <= reach && k !== st.step ? ' data-step="' + k + '" role="button" tabindex="0"' : '') +
          '><i>' + (ok && k !== st.step ? '\u2713' : k + 1) + '</i><span>' + esc(s.name) + '</span></li>';
      }).join('') + '</ol>';
    }

    function checkHtml(s) {
      const c = s.check; if (!c) return '';
      const done = st.done[s.id], tries = st.tries[s.id] || 0, wrong = st.wrong[s.id] || [];
      const tryLine = tries && !done ? ' <small>' + esc(tries === 1 ? T('lesson.try1') : T('lesson.tries', { n: tries })) + '</small>' : '';
      let inner = '<p class="q">' + esc(c.q) + '</p>';
      const design = o.figure && o.figure.examHtml ? '<div class="qfig" data-qfig><p class="cap">' + esc(T('lesson.qfigCap', { year: o.year })) + '</p>' + o.figure.examHtml() + '</div>' : '';
      if (c.kind === 'choose') {
        const opts = shuffled(c.opts.map((op, i) => Object.assign({ i }, op)), st.seed + steps.indexOf(s) * 7);
        inner += design + '<div class="opts">' + opts.map((op) => {
          const struck = wrong.includes(op.i), cls = struck ? ' wrong' : done && op.ok ? ' right' : '';
          return '<button class="opt' + cls + '" data-opt="' + op.i + '"' + (done || struck ? ' disabled' : '') + '>' + esc(op.t) + '</button>';
        }).join('') + '</div>';
      } else {
        inner += (done ? '' : '<p class="note">' + esc(T('lesson.clickDesign')) + '</p>') + design;
      }
      inner += '<div class="fb" data-fb>' + (done ? '<p class="' + (done.how === 'right' ? 'okline' : 'revealed') + '">' + esc(done.msg) + '</p>' : '') + '</div>';
      return '<div class="qcheck' + (done ? ' settled' : '') + '"><h4>' + esc(T('lesson.quick')) + tryLine + '</h4>' + inner + '</div>';
    }

    function gridHtml(g) {
      return '<div class="lgrid"><span class="lab">' + esc(g.cap) + '</span><table><tr>' + g.cols.map((c) => '<th>' + esc(c) + '</th>').join('') + '</tr>' +
        g.rows.map((r) => '<tr>' + r.map((c) => (c == null ? '<td class="null">' + esc(T('lesson.nullCell')) + '</td>' : '<td>' + esc(c) + '</td>')).join('') + '</tr>').join('') + '</table></div>';
    }

    function stepHtml(k) {
      const s = steps[k];
      let html = '<div class="lstep"><div class="lhead"><span class="lnum">' + esc(T('lesson.step', { k: k + 1, n })) + '</span><h3>' + esc(s.title) + '</h3></div>';
      html += '<div class="teach">' + s.teach.map((p) => '<p>' + esc(p) + '</p>').join('') + '</div>';
      if (s.hl && s.hl.say) html += '<p class="say">' + esc(s.hl.say) + '</p>';
      if (s.write && s.write.length) html += '<span class="lab">' + esc(T('lesson.write')) + '</span><ul class="lwrite">' + s.write.map((w) => '<li>' + esc(w) + '</li>').join('') + '</ul>';
      if (s.shape) html += '<div class="shape"><span class="lab">' + esc(T('lesson.shape')) + '</span>' + blockHtml(s.shape, null, isText, 'shp') + '</div>';
      if (s.example && s.example.length) html += '<span class="lab">' + esc(T('lesson.example')) + '</span>' + blockHtml(s.example.join('\n'), null, isText);
      if (s.sql) {
        const lab = s.whole ? T(isText ? 'lesson.wholeText' : 'lesson.whole') : s.prev != null ? T(isText ? 'lesson.soFarTextNew' : 'lesson.soFarNew') : T(isText ? 'lesson.soFarText' : 'lesson.soFar');
        html += '<div class="grow"><span class="lab">' + esc(lab) + '</span>' + blockHtml(s.sql, s.whole ? null : s.prev, isText) + '</div>';
      }
      if (s.grid) html += gridHtml(s.grid);
      if (s.whole && (s.why.length || s.marks.length)) {
        html += '<div class="whycard">' + (s.why.length ? '<h4>' + esc(T('lesson.why')) + '</h4><ol>' + s.why.map((w) => '<li>' + esc(w) + '</li>').join('') + '</ol>' : '') +
          (s.marks.length ? '<h4>' + esc(T('lesson.marks')) + '</h4><ul class="marklist">' + s.marks.map((m) => { const mm = /^\[([^\]]+)\]\s*(.*)$/.exec(m); return '<li><span>' + esc(mm ? mm[2] : m) + '</span>' + (mm ? '<span class="mk">' + esc(mm[1]) + '</span>' : '') + '</li>'; }).join('') + '</ul>' : '') + '</div>';
      }
      html += checkHtml(s);
      html += '<div class="row lnav">' + (k > 0 ? '<button class="btn ghost" data-back>' + esc(T('lesson.back')) + '</button>' : '<button class="btn ghost" data-out="ask">' + esc(T('lesson.backQ')) + '</button>') +
        (k < n - 1 ? '<button class="btn" data-next' + (settled(k) ? '' : ' disabled') + '>' + esc(T('lesson.next', { name: steps[k + 1].name })) + '</button>' + (settled(k) ? '' : '<span class="note">' + esc(T('lesson.answerFirst')) + '</span>')
          : '<button class="btn" data-out="turn"' + (settled(k) ? '' : ' disabled') + '>' + esc(T('lesson.toTurn')) + '</button>' + (settled(k) ? '' : '<span class="note">' + esc(T('lesson.answerFirst')) + '</span>')) + '</div></div>';
      return html;
    }

    // light the answer, in the side figure and in the design inside the check
    function lightAnswer(c) {
      const spec = { pane: c.pane || 'exam', f: c.kind === 'field' ? answers(c) : [], t: c.kind === 'table' ? c.answer : null, strong: true };
      if (o.figure) o.figure.highlight(spec);
      const qf = host.querySelector('[data-qfig]'); if (!qf) return;
      if (c.kind === 'table') qf.querySelectorAll('.tbl[data-t]').forEach((t) => { if (t.dataset.t === c.answer) t.classList.add('hl', 'strong'); });
      else qf.querySelectorAll('tr[data-f]').forEach((r) => { if (answers(c).includes(r.dataset.f)) { r.classList.add('hl', 'strong'); const t = r.closest('.tbl'); if (t) t.classList.add('hl2'); } });
    }

    function paint(scroll) {
      if (pickOff) { pickOff(); pickOff = null; }
      const s = steps[st.step], c = s.check, d = c && st.done[s.id];
      host.innerHTML = '<div class="banner"><b>' + esc(T('lesson.banner')) + '</b> ' + esc(V.banner) + '</div><div class="card lesson"><div class="ltask">' + esc(V.task) + '</div>' + strip() + stepHtml(st.step) + '</div>';
      if (o.figure) {
        if (c && d && c.kind !== 'choose') lightAnswer(c);
        else { o.figure.highlight(s.hl ? { pane: s.hl.pane || 'lesson', t: s.hl.t, f: s.hl.f } : null); if (!s.hl) o.figure.showPane('lesson'); }
      }
      wire();
      if (c && !d && c.kind !== 'choose') {
        const qf = host.querySelector('[data-qfig]');
        if (qf) {
          qf.classList.add(c.kind === 'table' ? 'pick-tables' : 'pick-fields');
          qf.addEventListener('click', (e) => { const hit = c.kind === 'table' ? e.target.closest('.tbl[data-t]') : e.target.closest('tr[data-f]'); if (hit) answer(c.kind === 'table' ? hit.dataset.t : hit.dataset.f); });
        }
        // the side figure answers too: a click on the exam pane counts; a click on the lesson pane is told so and switched over
        if (o.figure) pickOff = o.figure.pickable(c.pane || 'exam', c.kind, (picked) => answer(picked), () => {
          const fb = host.querySelector('[data-fb]'); if (fb) fb.innerHTML = '<p class="notthat">' + esc(T('lesson.otherPane')) + '</p>'; o.figure.showPane(c.pane || 'exam');
        });
      }
      if (scroll !== false) { const w = host.closest('.work'); if (w) w.scrollTop = 0; }
    }

    function answer(picked) {
      const s = steps[st.step], c = s.check, fb = host.querySelector('[data-fb]');
      if (!c || st.done[s.id]) return;
      let right, why;
      if (c.kind === 'choose') { const op = c.opts[picked]; if (!op) return; right = !!op.ok; why = op.why || (right ? T('lesson.yes') : T('lesson.notThatOne')); }
      else {
        right = answers(c).includes(picked);
        if (right) why = c.okwhy || T('lesson.yes');
        else {
          const outside = c.kind === 'field' && !answers(c).some((a) => tableOf(a) === tableOf(picked));
          why = (c.wrong && c.wrong[picked]) || (outside && c.outside) || (c.wrong && c.wrong['*']) || T('lesson.notThatOne');
        }
      }
      if (right) { st.done[s.id] = { how: 'right', msg: why }; o.save(); paint(false); return; }
      const wrong = (st.wrong[s.id] = st.wrong[s.id] || []);
      if (!wrong.includes(picked)) wrong.push(picked);
      st.tries[s.id] = (st.tries[s.id] || 0) + 1;
      if (st.tries[s.id] >= 2) {
        let reveal;
        if (c.kind === 'choose') { const ans = c.opts.find((x) => x.ok); reveal = T('lesson.answerIs', { a: ans.t, why: ans.why || '' }); }
        else if (c.kind === 'table') reveal = T('lesson.answerIs', { a: c.answer, why: c.okwhy || '' });
        else if (answers(c).length > 1) reveal = T('lesson.answerIsFields', { list: answers(c).join(T('lesson.or')), why: c.okwhy || '' });
        else reveal = T('lesson.answerIsField', { f: c.answer.replace(/^.*\./, ''), t: tableOf(c.answer), why: c.okwhy || '' });
        st.done[s.id] = { how: 'revealed', msg: (why + ' ' + reveal).trim() };
        o.save(); paint(false);
        return;
      }
      o.save();
      fb.innerHTML = '<p class="notthat">' + esc(T('lesson.notThat', { why })) + '</p>';
      if (c.kind === 'choose') { const b = host.querySelector('[data-opt="' + picked + '"]'); if (b) { b.classList.add('wrong'); b.disabled = true; } }
      const h4 = host.querySelector('.qcheck h4'); if (h4) h4.innerHTML = esc(T('lesson.quick')) + ' <small>' + esc(st.tries[s.id] === 1 ? T('lesson.try1') : T('lesson.tries', { n: st.tries[s.id] })) + '</small>';
    }

    function go(k) { st.step = k; o.save(); paint(); }
    function wire() {
      host.querySelectorAll('[data-opt]').forEach((b) => b.addEventListener('click', () => answer(+b.dataset.opt)));
      host.querySelectorAll('[data-step]').forEach((li) => {
        li.addEventListener('click', () => go(+li.dataset.step));
        li.addEventListener('keydown', (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); go(+li.dataset.step); } });
      });
      const nx = host.querySelector('[data-next]'); if (nx) nx.addEventListener('click', () => { if (settled(st.step)) go(st.step + 1); });
      const bk = host.querySelector('[data-back]'); if (bk) bk.addEventListener('click', () => go(st.step - 1));
      host.querySelectorAll('[data-out]').forEach((b) => b.addEventListener('click', () => {
        if (b.dataset.out === 'turn') st.finished = true;
        o.save(); if (pickOff) { pickOff(); pickOff = null; } o.onOut(b.dataset.out);
      }));
    }

    paint();
    return { destroy: () => { if (pickOff) { pickOff(); pickOff = null; } } };
  }
  window.Lesson = { render };
})();

</script>
<script>
/* Coursework guide renderer, version 2 (screens, walkthroughs, marked screenshots).
   CW.mount(host, {base, api, go}) then CW.show('#cw' | '#cw/07' | '#cw/07/2-3').
   api = {open(ch), screen(ch, key), tick(ch, id, on), copy(ch, id), reveal(ch, id), done(ch, on), download(file)} \u2014 all optional. */
window.CW = (function () {
  'use strict';
  var NS = 'http://www.w3.org/2000/svg';
  var S = { host: null, base: 'content/coursework/', api: {}, go: null, ch: null, ticks: null, seen: null, root: null, flat: [], cur: -1, collect: null };

  function h(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function md(s) { return h(s).replace(/\*\*(.+?)\*\*/g, '<b>$1</b>').replace(/`([^`]+)`/g, function (m, c) { return c.length <= 16 ? '<code class="nw">' + c + '</code>' : '<code>' + c.replace(/([.\-_])/g, '$1<wbr>') + '</code>'; }).replace(/\[\[([^|\]]+)\|(\d+)\]\]/g, '<span class="wd" tabindex="0" role="button" data-w="$2">$1</span>'); }
  function el(html) { var t = document.createElement('template'); t.innerHTML = html.trim(); return t.content.firstElementChild; }
  function call(fn) { try { var f = S.api[fn]; if (f) return f.apply(null, [].slice.call(arguments, 1)); } catch (e) { console.warn('api.' + fn, e); } }
  function getJSON(name) { return fetch(S.base + name, { cache: 'no-cache' }).then(function (r) { if (!r.ok) throw new Error(r.status + ' ' + name); return r.json(); }); }
  function store(k, v) { try { if (v === null) localStorage.removeItem(k); else localStorage.setItem(k, JSON.stringify(v)); } catch (e) { } }
  function load(k, d) { try { var v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } }
  function mainEl() { return S.host.closest('main') || null; }

  /* ---------- ticks and seen screens ---------- */
  function tickKey(ch) { return 'cw:ticks:' + ch; }
  function loadTicks(ch) { return new Set(load(tickKey(ch), [])); }
  function saveTicks() { store(tickKey(S.ch.id), Array.from(S.ticks)); }
  function setTick(id, on) {
    if (on) S.ticks.add(id); else S.ticks.delete(id);
    saveTicks(); call('tick', S.ch.id, id, on); paintStages();
  }
  function loadSeen(ch) { return new Set(load('cw:seen:' + ch, [])); }

  /* ---------- a small highlighter (keywords, strings, comments, numbers, @variables) ---------- */
  var KW = {
    sql: /\b(CREATE|OR|ALTER|PROCEDURE|AS|BEGIN|END|SET|ON|OFF|DECLARE|SELECT|FROM|WHERE|AND|NOT|EXISTS|IF|ELSE|INSERT|INTO|VALUES|UPDATE|DELETE|JOIN|LEFT|INNER|ORDER|BY|GROUP|RETURN|OUTPUT|IN|IS|NULL|TOP|PRINT|EXEC|CAST|ISNULL|COUNT|SUM|MAX|MIN|ROUND|GETDATE|DATEADD|DATEDIFF|DATENAME|SCOPE_IDENTITY|INT|VARCHAR|DECIMAL|DATETIME|DATE|TIME|BIT|MONEY|WEEKDAY|MINUTE|HOUR|DAY|DESC|ASC|HAVING|LIKE|BETWEEN|DISTINCT|USE|GO|TABLE|PRIMARY|KEY|FOREIGN|REFERENCES|IDENTITY|DEFAULT|UNIQUE|CHECK|CONSTRAINT|DROP|ADD|WITH)\b/y,
    cs: /\b(using|namespace|public|private|static|readonly|class|partial|void|int|string|bool|new|return|if|else|foreach|for|in|try|catch|finally|this|null|true|false|is|as|override|base|get|set|DateTime|List|TimeSpan|Convert|decimal|double|object|const|event|delegate|protected|virtual|break|continue|while|switch|case|default|sealed)\b/y
  };
  function hl(lang, line) {
    if (!KW[lang]) return h(line);
    var out = '', i = 0, n = line.length;
    while (i < n) {
      var rest = line.slice(i), m;
      if (lang === 'sql' && rest.slice(0, 2) === '--') { out += '<span class="tok-c">' + h(rest) + '</span>'; break; }
      if (lang === 'cs' && rest.slice(0, 2) === '//') { out += '<span class="tok-c">' + h(rest) + '</span>'; break; }
      if ((m = /^(N?'(?:[^']|'')*'|"(?:[^"\\]|\\.)*"|@"(?:[^"]|"")*")/.exec(rest))) { out += '<span class="tok-s">' + h(m[1]) + '</span>'; i += m[1].length; continue; }
      if ((m = /^(@@?\w+)/.exec(rest)) && lang === 'sql') { out += '<span class="tok-v">' + h(m[1]) + '</span>'; i += m[1].length; continue; }
      if ((m = /^(\d+(?:\.\d+)?[mMfF]?)\b/.exec(rest)) && (i === 0 || !/[\w@]/.test(line[i - 1]))) { out += '<span class="tok-n">' + m[1] + '</span>'; i += m[1].length; continue; }
      if ((m = /^([A-Za-z_]\w*)/.exec(rest))) {
        var w = m[1]; KW[lang].lastIndex = 0;
        out += (KW[lang].test(w) && w.length === KW[lang].lastIndex) ? '<span class="tok-k">' + h(w) + '</span>' : h(w);
        i += w.length; continue;
      }
      out += h(rest[0]) + (rest[0] === '.' ? '<wbr>' : ''); i++;   // a long line wraps after a dot, never mid-name
    }
    return out;
  }

  /* ---------- clipboard ---------- */
  function copyText(text) {
    if (!/\n$/.test(text)) text += '\n';
    if (navigator.clipboard && navigator.clipboard.writeText) return navigator.clipboard.writeText(text);
    return new Promise(function (ok, no) {
      var ta = document.createElement('textarea'); ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
      document.body.appendChild(ta); ta.select();
      try { document.execCommand('copy'); ok(); } catch (e) { no(e); } document.body.removeChild(ta);
    });
  }
  function copyButton(label, text, blockId) {
    var b = el('<button class="btn sec sm" type="button">' + h(label) + '</button>');
    b.addEventListener('click', function () {
      copyText(text).then(function () {
        b.textContent = 'Copied'; b.classList.add('copied'); call('copy', S.ch.id, blockId);
        setTimeout(function () { b.textContent = label; b.classList.remove('copied'); }, 1600);
      }, function () { b.textContent = 'Select the lines and press Ctrl+C'; });
    });
    return b;
  }

  /* ---------- simple blocks ---------- */
  function rP(b) { return el('<p>' + md(b.p) + '</p>'); }
  function rBox(b) {
    var x = b.box, inner = x.text ? '<p>' + md(x.text) + '</p>' : '';
    var node = x.fold
      ? el('<details class="card cw-box"><summary>' + h(x.title) + '</summary><div>' + inner + '</div></details>')
      : el('<div class="card cw-box"><h3>' + h(x.title) + '</h3>' + inner + '</div>');
    (x.blocks || []).forEach(function (sub) { var r = render(sub); if (r) (node.querySelector('div') || node).appendChild(r); });
    return node;
  }
  function rRule(b) {
    var names = { double: 'No double booking', stock: 'Stock is always right' };
    return el('<div class="cw-rule"><b>Rule that never breaks \u00b7 ' + h(names[b.rule.which] || '') + '</b><span>' + md(b.rule.text) + '</span></div>');
  }
  function rNeed(b) { return el('<div class="card cw-need"><h3>Before you start</h3><ul>' + b.need.map(function (x) { return '<li>' + md(x) + '</li>'; }).join('') + '</ul></div>'); }
  function rWords(b) {
    return el('<div class="card cw-words"><h3>Words used in this chapter</h3>' + (b.intro ? '<p class="wi">' + md(b.intro) + '</p>' : '') + '<dl>' + b.words.map(function (w, i) {
      var link = w[2] && S.ch ? ' <a class="see" href="#cw/' + h(S.ch.id) + '/' + h(w[2]) + '/w' + i + '">' + (w[3] ? 'See it in the code' : 'See it in use') + ' \u203a</a>' : '';
      return '<dt><span class="wd-look">' + h(w[0]) + '</span></dt><dd>' + md(w[1]) + link + '</dd>';
    }).join('') + '</dl></div>');
  }
  function rWrongList(list) {
    var wrap = el('<div class="cw-wrongs"></div>');
    list.forEach(function (w) {
      var q = Array.isArray(w) ? w[0] : w.q, a = Array.isArray(w) ? w[1] : w.a;
      wrap.appendChild(el('<details class="cw-wrong"><summary><b>If it goes wrong</b><span>' + md(q) + '</span></summary><div>' + md(a) + '</div></details>'));
    });
    return wrap;
  }

  /* ---------- marked screenshots ---------- */
  function markList(marks) {
    return '<ol class="mk-list">' + marks.map(function (m) { return '<li><i>' + h(m.n) + '</i><span>' + md(m.say) + '</span></li>'; }).join('') + '</ol>';
  }
  function rShot(x, cls, noList) {
    var w = x.w || 800, hh = x.h || 450, marks = x.marks || [];
    var fig = el('<figure class="cw-shot ' + (cls || '') + '"></figure>');
    if (x.missing) {
      fig.appendChild(el('<div class="frame" style="width:min(100%,' + w + 'px);aspect-ratio:' + w + '/' + hh + '"><div><b>Screenshot to come</b>' + h(x.alt) + '</div></div>'));
    } else {
      var pic = el('<div class="pic" style="max-width:' + w + 'px"><img src="' + h(S.base + x.img) + '" alt="' + h(x.alt) + '"></div>');
      // a box's badge sits above its top-left corner, unless another mark is already there: then it goes beside the box
      function crowded(m) {
        return marks.some(function (o) {
          if (o === m) return false;
          if (o.w == null) return Math.abs(+o.x - m.x) < 5 && +o.y < +m.y + 1 && +o.y > +m.y - 8;
          var bottom = +o.y + (+o.h);
          return +o.x < +m.x + 4 && +o.x + (+o.w) > +m.x - 1 && bottom > +m.y - 6 && bottom < +m.y + 1;
        });
      }
      marks.forEach(function (m) {
        var box = m.w != null;
        // a box that covers most of the picture keeps its badge inside its corner, so the badge hides nothing above it
        var big = box && +m.w >= 50 && +m.h >= 50;
        pic.appendChild(el('<span class="mk ' + (box ? 'box' + (big ? ' inside' : +m.y < 5 ? (+m.x < 4 ? ' corner' : ' side') : (crowded(m) && +m.x >= 4 ? ' side' : '')) : 'ring') + '" style="left:' + (+m.x) + '%;top:' + (+m.y) + '%' + (box ? ';width:' + (+m.w) + '%;height:' + (+m.h) + '%' : '') + '"><i>' + h(m.n) + '</i></span>'));
      });
      fig.appendChild(pic);
      // on a phone a picture is small, so it can be opened full size in a new tab
      fig.appendChild(el('<a class="cw-full" href="' + h(S.base + x.img) + '" target="_blank" rel="noopener">Open this picture full size</a>'));
    }
    if (x.cap) fig.appendChild(el('<figcaption class="cap">' + md(x.cap) + '</figcaption>'));
    if (marks.length && !noList) fig.appendChild(el(markList(marks)));
    return fig;
  }

  /* ---------- steps ---------- */
  function tickButton(id, on) {
    var n = id.split('.').pop();
    return el('<button class="tick" type="button" aria-pressed="' + (on ? 'true' : 'false') + '" title="Tick this step when you have done it"><span>' + h(n) + '</span></button>');
  }
  function rSteps(b) {
    var ol = el('<ol class="cw-steps"></ol>');
    b.steps.forEach(function (s) {
      var on = S.ticks.has(s.id);
      var li = el('<li data-id="' + h(s.id) + '"' + (on ? ' class="on"' : '') + '></li>');
      var tb = tickButton(s.id, on);
      var body = el('<div></div>');
      body.appendChild(el('<div class="do">' + md(s.do) + '</div>'));
      if (s.copy) { var cb = findCode(s.copy), btn = cb && stepCopyButton(cb); if (btn) { var w = el('<div class="cw-step-copy"></div>'); w.appendChild(btn); body.appendChild(w); } }
      if (s.download) {
        var dl = el('<div class="cw-step-copy"><a class="btn cw-dl" href="' + h(S.base) + 'files/' + h(s.download.file) + '" download>' + h(s.download.label) + (s.download.size ? ' <span>(' + h(s.download.size) + ')</span>' : '') + '</a></div>');
        dl.querySelector('a').addEventListener('click', function () { call('download', s.download.file); });
        body.appendChild(dl);
      }
      // a picture that marks the next few steps too comes after this step's "You should see", so that line is not read as the last mark's
      var many = s.img && (s.img.marks || []).length > 1, see = s.see && el('<div class="cw-see"><b>You should see</b>' + md(s.see) + '</div>');
      if (s.img && !many) body.appendChild(rShot(s.img, '', (s.img.marks || []).length === 1 && s.img.marks[0].n === s.n && s.img.marks[0].say === s.do));
      if (see) body.appendChild(see);
      if (many) body.appendChild(rShot(s.img, 'ahead'));
      if (s.wrong) body.appendChild(rWrongList(s.wrong));
      tb.addEventListener('click', function () { var now = !li.classList.contains('on'); li.classList.toggle('on', now); tb.setAttribute('aria-pressed', now); setTick(s.id, now); });
      li.appendChild(tb); li.appendChild(body); ol.appendChild(li);
    });
    return ol;
  }

  /* ---------- code ---------- */
  function findCode(id) {
    var found = null;
    (S.ch && S.ch.stages || []).forEach(function (st) { (st.screens || []).forEach(function (sc) { (sc.blocks || []).forEach(function (b) {
      if (b.code && b.code.id === id) found = b.code;
      if (b.box && b.box.blocks) b.box.blocks.forEach(function (x) { if (x.code && x.code.id === id) found = x.code; });
    }); }); });
    return found;
  }
  function stepCopyLabel(c) {
    /* "Copy usp_BookAppointment" / "Copy Forms/frmDiary.cs" when the title starts with a name;
       "Copy the test" / "Copy the code" when it starts with a sentence. */
    var name = c.title.split(':')[0].trim();
    if (/\s/.test(name) && !/\.(cs|sql|config)$/i.test(name)) name = /test/i.test(name) ? 'the test' : 'the code';
    if (/^(The|A|An|Your) /.test(name)) name = name.charAt(0).toLowerCase() + name.slice(1);
    return 'Copy ' + name;
  }
  function stepCopyButton(c) {
    if (c.noCopy || (c.kind === 'type' && !hasGap(c))) return null;   // never a copy of lines she must type
    if (c.kind === 'type' && hasGap(c)) return copyButton(stepCopyLabel(c) + ', with a gap for the yellow lines', codeWithGap(c), c.id);
    return copyButton(stepCopyLabel(c), c.text, c.id);
  }
  /* ids of code blocks that a step on this screen carries a Copy button for: the block header then shows none */
  function stepCopyIds(blocks, acc) {
    (blocks || []).forEach(function (b) {
      if (b.steps) b.steps.forEach(function (st) { if (st.copy) acc[st.copy] = true; });
      if (b.box && b.box.blocks) stepCopyIds(b.box.blocks, acc);
    });
    return acc;
  }
  function inFocus(ranges, ln) { return (ranges || []).some(function (r) { return ln >= r[0] && ln <= r[1]; }); }
  // a gap copy only helps when some lines are not yellow; a card that is all yellow is typed whole, so it gets no Copy button
  function hasGap(c) { if (!c.focusLines || !c.focusLines.length) return false; for (var i = 1, n = c.text.split('\n').length; i <= n; i++) if (!inFocus(c.focusLines, i)) return true; return false; }
  function codeWithGap(c) {
    var lines = c.text.split('\n'), out = [], mark = c.lang === 'sql' ? '-- YOU TYPE THIS PART' : c.lang === 'txt' ? 'YOU TYPE THIS PART' : '// YOU TYPE THIS PART';
    for (var i = 1; i <= lines.length; i++) {
      var r = (c.focusLines || []).filter(function (x) { return x[0] === i; })[0];
      if (r) { var ind = (lines[i - 1].match(/^\s*/) || [''])[0]; out.push(ind + mark + ' (' + (r[1] - r[0] + 1) + ' lines)'); i = r[1]; continue; }
      if (!inFocus(c.focusLines, i)) out.push(lines[i - 1]);
    }
    return out.join('\n');
  }
  function rPre(c) {
    var pre = el('<pre class="cw-pre" tabindex="0"></pre>');
    c.text.split('\n').forEach(function (line, i) {
      var ln = i + 1, cls = 'ln' + (inFocus(c.focusLines, ln) ? ' f' : '');
      var lineEl = el('<span class="' + cls + '" data-l="' + ln + '">' + (hl(c.lang, line) || ' ') + '</span>');
      (c.wordMarks || []).forEach(function (m) { if (m[0] === ln) markRange(lineEl, m[1], m[2], m[3]); });
      pre.appendChild(lineEl);
    });
    return pre;
  }
  /* Wraps characters a to b of one code line in a word mark, across the highlighter's spans. */
  function markRange(lineEl, a, b, i) {
    var tw = document.createTreeWalker(lineEl, NodeFilter.SHOW_TEXT), pos = 0, n, r = document.createRange(), started = false;
    while ((n = tw.nextNode())) {
      var len = n.nodeValue.length;
      if (!started && a < pos + len) { r.setStart(n, a - pos); started = true; }
      if (started && b <= pos + len) { r.setEnd(n, b - pos); break; }
      pos += len;
    }
    if (!started) return;
    var w = document.createElement('span'); w.className = 'wd'; w.tabIndex = 0; w.setAttribute('role', 'button'); w.dataset.w = i;
    w.appendChild(r.extractContents()); r.insertNode(w);
  }
  /* The words from this chapter that are marked in one code block, with their plain meanings. */
  function rWordLegend(c) {
    var seen = [], g = S.ch && S.ch.glossary; if (!g || !c.wordMarks) return null;
    c.wordMarks.forEach(function (m) { if (seen.indexOf(m[3]) < 0) seen.push(m[3]); });
    if (!seen.length) return null;
    return el('<div class="cw-wds"><b>Words from this chapter in this code</b><dl>' + seen.map(function (i) { return '<dt><span class="wd-look">' + h(g[i][0]) + '</span></dt><dd>' + md(g[i][1]) + '</dd>'; }).join('') + '</dl></div>');
  }

  /* The walkthrough: code on the left, one card per part on the right, level with its lines and joined by a leader line.
     "Walk me through it" lights one part at a time. Under 860 px the cards stack beneath the code. */
  function rWalk(c, pre) {
    var parts = c.partLines, st = { walking: false, cur: -1, stacked: false };
    var wrap = el('<div class="cw-walk"></div>');
    var top = el('<div class="wtop"><span class="q">What is going on here?</span><span class="hint">Point at a line, or at a card, to see what goes with what.</span></div>');
